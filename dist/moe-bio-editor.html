<script>
function handleAssetUpload(e) {
  const files = e.target.files;
  if (!files || files.length === 0) return;

  Array.from(files).forEach(file => {
    if (!file.type.startsWith("image/")) return;

    const reader = new FileReader();
    reader.onload = (ev) => {
      const asset = {
        id: generateId(),
        type: "image",
        name: file.name,
        src: ev.target.result,
        createdAt: Date.now()
      };
      state.assets.push(asset);
      renderAssets();
      saveState();
    };
    reader.readAsDataURL(file);
  });

  e.target.value = "";
}

function renderAssets() {
  const grid = document.getElementById("assets-grid");
  if (!grid) return;

  grid.innerHTML = "";

  if (state.assets.length === 0) {
    grid.innerHTML = '<div class="assets-empty">No assets yet</div>';
    return;
  }

  state.assets.forEach(asset => {
    const item = document.createElement("div");
    item.className = "asset-item";
    item.title = asset.name;

    const img = document.createElement("img");
    img.src = asset.src;
    img.alt = asset.name;
    item.appendChild(img);

    // Delete button (shows on hover)
    const delBtn = document.createElement("button");
    delBtn.className = "asset-delete";
    delBtn.textContent = "×";
    delBtn.title = "Delete";
    delBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      deleteAsset(asset.id);
    });
    item.appendChild(delBtn);

    // Click to add to canvas (with correct aspect ratio)
    item.addEventListener("click", () => {
      const tmpImg = new Image();
      tmpImg.onload = () => {
        const maxSize = 200;
        const ratio = tmpImg.naturalWidth / tmpImg.naturalHeight;
        let w, h;
        if (tmpImg.naturalWidth > tmpImg.naturalHeight) {
          w = Math.min(tmpImg.naturalWidth, maxSize);
          h = w / ratio;
        } else {
          h = Math.min(tmpImg.naturalHeight, maxSize);
          w = h * ratio;
        }
        createElement("image", {
          width: Math.round(w),
          height: Math.round(h),
          content: { src: asset.src }
        });
      };
      tmpImg.src = asset.src;
    });

    grid.appendChild(item);
  });
}

function deleteAsset(id) {
  state.assets = state.assets.filter(a => a.id !== id);
  renderAssets();
  saveState();
}

</script>
<script>
const STORAGE_KEY = "moe_bio_editor_state_singlefile";

function saveState() {
  try {
    const data = {
      canvas: state.canvas,
      elements: state.elements,
      grid: state.grid,
      assets: state.assets
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn("Failed to save state:", e);
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;

    const data = JSON.parse(raw);

    if (data.canvas) {
      state.canvas = { ...state.canvas, ...data.canvas };
    }
    if (data.elements && Array.isArray(data.elements)) {
      state.elements = data.elements;
    }
    if (data.grid) {
      state.grid = { ...state.grid, ...data.grid };
    }
    if (data.assets && Array.isArray(data.assets)) {
      state.assets = data.assets;
    }
  } catch (e) {
    console.warn("Failed to load state:", e);
  }
}

</script>
<script>
// Browser canvas bitmaps have hard size limits. Chrome / Edge allow roughly
// 268M px, but Safari and iOS cap out near 16.7M px — a 600×30000 long page
// (18M px) fails there, and it fails *silently* (blank image, no error). Long
// pages therefore export scaled down to fit instead of coming back empty.
// One slice-free render, no multi-image export: that would be over-engineering.
const MAX_EXPORT_PIXELS = 16e6;

function exportPNG() {
  const canvasEl = document.getElementById("canvas");
  if (!canvasEl) return;

  const pageW = Math.max(1, Math.round(state.canvas.width));
  const pageH = Math.max(1, Math.round(state.canvas.height));
  const scale = Math.min(1, Math.sqrt(MAX_EXPORT_PIXELS / (pageW * pageH)));

  const tempCanvas = document.createElement("canvas");
  tempCanvas.width = Math.max(1, Math.round(pageW * scale));
  tempCanvas.height = Math.max(1, Math.round(pageH * scale));
  const ctx = tempCanvas.getContext("2d");
  // Everything below draws in page coordinates, so one scale call is enough.
  if (scale < 1) ctx.scale(scale, scale);

  if (scale < 1) {
    showExportNotice(
      `页面 ${pageW}×${pageH} 超出浏览器画布上限，已按 ${Math.round(scale * 100)}% 导出（${tempCanvas.width}×${tempCanvas.height}）`
    );
  }

  // Fill background
  ctx.fillStyle = state.canvas.background;
  ctx.fillRect(0, 0, pageW, pageH);

  // Sort elements by zIndex
  const sorted = [...state.elements].sort((a, b) => a.zIndex - b.zIndex);

  let pending = sorted.length;
  if (pending === 0) {
    downloadCanvas(tempCanvas);
    return;
  }

  sorted.forEach(el => {
    renderElementToExportCanvas(ctx, el, () => {
      pending--;
      if (pending === 0) {
        downloadCanvas(tempCanvas);
      }
    });
  });
}

function renderElementToExportCanvas(ctx, el, onDone) {
  ctx.save();
  ctx.globalAlpha = el.style.opacity ?? 1;

  if (el.type === "text") {
    // Wrapped at the element's own width, the way .element-text wraps in the
    // preview. The old "one fillText per \n" behaviour ignored wrapping, which
    // is invisible on a wide box and obvious on a tall narrow one.
    drawTextBlock(ctx, el.content, el.x, el.y, el.width, {
      fontSize: el.style.fontSize,
      fontWeight: el.style.fontWeight,
      color: el.style.color,
      align: el.style.textAlign,
      lineHeight: el.style.lineHeight,
      fontFamily: el.style.fontFamily
    });

    ctx.restore();
    onDone();
  } else if (el.type === "textbox") {
    // Mirrors .element-textbox: the frame first, then each column's title and
    // body inside the padded content box.
    drawBoxFrame(ctx, el);

    const s = el.style || {};
    const meta = readBoxLayout(s);
    const pad = readPadding(s, 12);
    const bw = Number(s.borderWidth) || 0;
    const area = {
      x: el.x + pad.h + bw,
      y: el.y + pad.v + bw,
      width: el.width - (pad.h + bw) * 2,
      height: el.height - (pad.v + bw) * 2
    };

    const rects = boxColumnRects(meta, area);
    getBoxColumns(el).slice(0, rects.length).forEach((column, i) => {
      drawBoxColumn(ctx, column, rects[i], meta, s);
    });

    ctx.restore();
    onDone();
  } else if (el.type === "image") {
    // The frame is a box, so it exports even before a photo is chosen.
    const shape = getImageShape(el);
    if (!el.content || !el.content.src) {
      drawBoxFrame(ctx, el, shape);
      ctx.restore();
      onDone();
      return;
    }

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      const s = el.style || {};
      const area = getPictureArea(el);
      const crop = el.content.crop;

      // Background, borders and shadow. The shape clips the frame, which is what
      // makes the inner border read as a ring on a circular crop.
      drawBoxFrame(ctx, el, shape);

      // The photo, clipped to the same shape the frame was clipped to.
      ctx.save();
      if (!clipToShape(ctx, el.x, el.y, el.width, el.height, shape)) {
        roundRect(ctx, el.x, el.y, el.width, el.height, Math.max(0, Number(s.borderRadius) || 0));
        ctx.clip();
      }

      if (crop && el.content.naturalWidth && el.content.naturalHeight) {
        // Crop geometry is stored relative to the element box, so remap it onto
        // the (inset) picture area — padding and borders shrink the photo here
        // exactly like they do in the editor.
        const geo = getCropGeometry(el);
        const kx = area.width / el.width;
        const ky = area.height / el.height;
        ctx.drawImage(img, area.x + geo.ix * kx, area.y + geo.iy * ky, geo.dw * kx, geo.dh * ky);
      } else {
        drawFittedImage(ctx, img, area, readImageFit(el));
      }

      ctx.restore();
      ctx.restore();
      onDone();
    };
    img.onerror = () => {
      ctx.restore();
      onDone();
    };
    img.src = el.content.src;


  } else if (el.type === "sticker") {
    // Mirrors .element-sticker .element-content, which is a flex box centring a
    // single run of text in the element box. Without this branch a sticker was
    // placed, styled and then silently dropped from the PNG.
    const ss = el.style || {};
    const fontSize = Number(ss.fontSize) || 32;
    ctx.font = `${fontSize}px sans-serif`;
    ctx.fillStyle = ss.color || "#333333";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(el.content || "", el.x + el.width / 2, el.y + el.height / 2);
    ctx.restore();
    onDone();

  } else if (el.type === "divider") {
    // Mirrors .element-divider: .divider-line is `width: 100%` with the property
    // panel's `lineWidth` as its height, centred vertically in the box and
    // rounded by the 1px the CSS gives it. Same story as the sticker — it used
    // to vanish from the export.
    const ds = el.style || {};
    const lineWidth = Math.max(1, Number(ds.lineWidth) || 2);
    ctx.fillStyle = ds.color || "#333333";
    const lineY = el.y + (el.height - lineWidth) / 2;
    roundRect(ctx, el.x, lineY, el.width, lineWidth, Math.min(1, lineWidth / 2, el.width / 2));
    ctx.fill();
    ctx.restore();
    onDone();

  } else if (el.type === "label") {
    const ls = el.style || {};
    const lb = Number(ls.borderWidth) || 0;
    const lbColor = withAlpha(ls.borderColor, ls.borderAlpha);
    if (lb > 0 && lbColor !== "transparent") {
      // Inset by half so it reads as a CSS border rather than a centred stroke.
      ctx.strokeStyle = lbColor;
      ctx.lineWidth = lb;
      roundRect(ctx, el.x + lb / 2, el.y + lb / 2, el.width - lb, el.height - lb, Math.max(0, (ls.borderRadius || 0) - lb / 2));
      ctx.stroke();
    }
    ctx.font = `${el.style.fontWeight} ${el.style.fontSize}px sans-serif`;
    // The editor gets both of these from CSS — `text-transform: uppercase` and
    // `letter-spacing: 1px` on `.element-label .element-content`. Canvas2D has
    // no transform equivalent so it is applied by hand; `letterSpacing` is a
    // real context property in current engines and merely inert on older ones,
    // where the only loss is the tracking.
    ctx.letterSpacing = (Number(ls.letterSpacing) || 0) + "px";
    ctx.fillStyle = el.style.color;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(applyTextTransform(el.content, ls.textTransform), el.x + el.width / 2, el.y + el.height / 2);
    ctx.restore();
    onDone();
  } else {
    ctx.restore();
    onDone();
  }
}

// --- Shadow helpers ---------------------------------------------------------

function shadowEnabled(style) {
  const sh = readShadow(style);
  if (sh.color === "transparent") return false;
  return sh.x !== 0 || sh.y !== 0 || sh.blur !== 0 || sh.spread !== 0;
}

function applyShadow(ctx, style) {
  const sh = readShadow(style);
  ctx.shadowColor = sh.color;
  ctx.shadowBlur = sh.blur;
  ctx.shadowOffsetX = sh.x;
  ctx.shadowOffsetY = sh.y;
  // ctx.shadow* has no spread. Callers grow the caster silhouette instead.
}

function clearShadow(ctx) {
  ctx.shadowColor = "transparent";
  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;
}

// --- Shape paths ------------------------------------------------------------

function traceRoundRect(t, x, y, w, h, r, ry) {
  const rx = Math.max(0, Math.min(r, w / 2, h / 2));
  const ryv = Math.max(0, Math.min(ry === undefined ? r : ry, w / 2, h / 2));
  t.moveTo(x + rx, y);
  t.lineTo(x + w - rx, y);
  t.quadraticCurveTo(x + w, y, x + w, y + ryv);
  t.lineTo(x + w, y + h - ryv);
  t.quadraticCurveTo(x + w, y + h, x + w - rx, y + h);
  t.lineTo(x + rx, y + h);
  t.quadraticCurveTo(x, y + h, x, y + h - ryv);
  t.lineTo(x, y + ryv);
  t.quadraticCurveTo(x, y, x + rx, y);
  t.closePath();
}

// The `star` polygon, in the same 0..100 space the CSS clip-path uses, so a
// stretched box stretches the star instead of keeping it round.
const STAR_POINTS_100 = [
  [50, 0], [61, 35], [98, 35], [68, 57], [79, 91],
  [50, 70], [21, 91], [32, 57], [2, 35], [39, 35]
];

// Returns a Path2D for a crop shape, or null when the shape is a plain rect.
// Having a path object (instead of clipping straight away) lets the exporter
// fill the silhouette first so it can cast a shadow, then clip and draw.
function shapePath(shape, x, y, w, h) {
  if (!shape || shape === "none" || shape === "rect" || shape === "square") return null;

  const p = new Path2D();
  if (shape === "circle") {
    // Ellipse so a stretched window exports as an oval, matching the preview.
    p.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
  } else if (shape === "rounded") {
    // inset(0 round 20%) rounds by 20% of each axis, not one shared radius.
    traceRoundRect(p, x, y, w, h, w * 0.2, h * 0.2);
  } else if (shape === "heart") {
    drawHeartPath(p, x, y, w, h);
  } else if (shape === "star") {
    STAR_POINTS_100.forEach(([px, py], i) => {
      const cx = x + (px / 100) * w;
      const cy = y + (py / 100) * h;
      if (i === 0) p.moveTo(cx, cy);
      else p.lineTo(cx, cy);
    });
    p.closePath();
  } else if (shape === "diamond") {
    p.moveTo(x + w / 2, y);
    p.lineTo(x + w, y + h / 2);
    p.lineTo(x + w / 2, y + h);
    p.lineTo(x, y + h / 2);
    p.closePath();
  } else if (shape === "arch") {
    p.moveTo(x, y + h);
    p.lineTo(x, y + h * 0.3);
    p.quadraticCurveTo(x + w * 0.5, y, x + w, y + h * 0.3);
    p.lineTo(x + w, y + h);
    p.closePath();
  } else {
    return null;
  }
  return p;
}

// Fill the silhouette, using a plain rect when there is no shape.
function fillSilhouette(ctx, shape, x, y, w, h, radius) {
  const p = shapePath(shape, x, y, w, h);
  if (p) {
    ctx.fill(p);
  } else if (Number(radius) > 0) {
    // No shape clip, but the frame is rounded, so the ring must be too.
    roundRect(ctx, x, y, w, h, radius);
    ctx.fill();
  } else {
    ctx.fillRect(x, y, w, h);
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  traceRoundRect(ctx, x, y, w, h, r);
}

function clipToShape(ctx, x, y, w, h, shape) {
  const p = shapePath(shape, x, y, w, h);
  if (!p) return false;
  ctx.clip(p);
  return true;
}

// Mirrors the #clip-heart path so preview and export match.
function drawHeartPath(ctx, x, y, w, h) {
  const sx = w / 100;
  const sy = h / 100;
  ctx.moveTo(x + 50 * sx, y + 100 * sy);
  ctx.bezierCurveTo(x + 10 * sx, y + 68.2 * sy, x, y + 45.5 * sy, x, y + 28.4 * sy);
  ctx.bezierCurveTo(x, y + 11.4 * sy, x + 15 * sx, y, x + 30 * sx, y);
  ctx.bezierCurveTo(x + 40 * sx, y, x + 47 * sx, y + 8 * sy, x + 50 * sx, y + 17 * sy);
  ctx.bezierCurveTo(x + 53 * sx, y + 8 * sy, x + 60 * sx, y, x + 70 * sx, y);
  ctx.bezierCurveTo(x + 85 * sx, y, x + 100 * sx, y + 11.4 * sy, x + 100 * sx, y + 28.4 * sy);
  ctx.bezierCurveTo(x + 100 * sx, y + 45.5 * sy, x + 90 * sx, y + 68.2 * sy, x + 50 * sx, y + 100 * sy);
  ctx.closePath();
}

// Draws the photo inside a rect, honouring the fit mode. `cover` overflows and
// relies on the caller's clip, which is what the editor's overflow:hidden does.
function drawFittedImage(ctx, img, area, fit) {
  const iw = img.naturalWidth || area.width;
  const ih = img.naturalHeight || area.height;

  if (fit === "fill") {
    ctx.drawImage(img, area.x, area.y, area.width, area.height);
    return;
  }

  const imgRatio = iw / ih;
  const boxRatio = area.width / area.height;
  let w;
  let h;
  if (fit === "cover") {
    if (imgRatio > boxRatio) {
      h = area.height;
      w = h * imgRatio;
    } else {
      w = area.width;
      h = w / imgRatio;
    }
  } else if (imgRatio > boxRatio) {
    w = area.width;
    h = w / imgRatio;
  } else {
    h = area.height;
    w = h * imgRatio;
  }

  ctx.drawImage(img, area.x + (area.width - w) / 2, area.y + (area.height - h) / 2, w, h);
}

// Optional `shape` clips the frame itself, so a shape crops the background and
// the inner border as well as the photo — the same thing clip-path does on
// .element-content in the editor.
function drawBoxFrame(ctx, el, shape) {
  const s = el.style || {};
  const x = el.x;
  const y = el.y;
  const w = el.width;
  const h = el.height;
  const radius = shape ? 0 : (s.borderRadius || 0);

  const inner = Number(s.borderWidth) || 0;
  const outer = Number(s.borderOuterWidth) || 0;
  const bg = withAlpha(s.backgroundColor, s.backgroundAlpha);
  const innerColor = withAlpha(s.borderColor, s.borderAlpha);
  const outerColor = withAlpha(s.borderOuterColor, s.borderOuterAlpha);
  const sh = readShadow(s);
  const hasShadow = shadowEnabled(s);
  const hasOuter = outer > 0 && outerColor !== "transparent";

  // Canvas has no shadow `spread`, so a non-zero spread gets its own pass: a
  // caster grown (or shrunk) from the element box, painted in the shadow colour
  // so the extra ring reads as shadow rather than as a stray outline. The frame
  // is drawn on top of it afterwards.
  if (hasShadow && sh.spread !== 0) {
    const sw = Math.max(1, w + sh.spread * 2);
    const sh2 = Math.max(1, h + sh.spread * 2);
    applyShadow(ctx, s);
    ctx.fillStyle = sh.color;
    fillSilhouette(ctx, shape, x + (w - sw) / 2, y + (h - sh2) / 2, sw, sh2, Math.max(0, radius + sh.spread));
    clearShadow(ctx);
  }

  // Outer border is an outward ring. Without a spread it also carries the
  // shadow, which keeps the common case down to a single pass.
  if (hasOuter) {
    if (hasShadow && sh.spread === 0) applyShadow(ctx, s);
    ctx.fillStyle = outerColor;
    const ring = shapePath(shape, x - outer, y - outer, w + outer * 2, h + outer * 2);
    if (ring) {
      // even-odd: the grown silhouette minus the frame itself. Filling the
      // grown shape solid would be right only while the photo covers every
      // pixel of the frame — with padding, or a transparent frame, the middle
      // would show the border colour as a block instead of a ring.
      const hole = shapePath(shape, x, y, w, h);
      if (hole) ring.addPath(hole);
      ctx.fill(ring, "evenodd");
    } else {
      roundRect(ctx, x - outer, y - outer, w + outer * 2, h + outer * 2, radius + outer);
      ctx.fill();
    }
    clearShadow(ctx);
  }

  // Background. With no outer ring it casts the shadow itself. A transparent
  // background still casts one, because the wrapper carries a box-shadow in the
  // editor whether or not the box is filled — so the silhouette stands in for it.
  if (bg !== "transparent") {
    if (hasShadow && sh.spread === 0 && !hasOuter) applyShadow(ctx, s);
    ctx.fillStyle = bg;
    fillSilhouette(ctx, shape, x, y, w, h, radius);
    clearShadow(ctx);
  } else if (hasShadow && sh.spread === 0 && !hasOuter) {
    applyShadow(ctx, s);
    ctx.fillStyle = sh.color;
    fillSilhouette(ctx, shape, x, y, w, h, radius);
    clearShadow(ctx);
  }

  // Inner border, inset by half its width so it reads as sitting inside the
  // box the way a CSS border does. With a shape it follows the shape, which is
  // what the clip-path does to the border in the editor.
  if (inner > 0 && innerColor !== "transparent") {
    ctx.strokeStyle = innerColor;
    ctx.lineWidth = inner;
    if (s.boxStyle === "dashed") ctx.setLineDash([6, 4]);
    const bx = x + inner / 2;
    const by = y + inner / 2;
    const bw = w - inner;
    const bh = h - inner;
    const p = shapePath(shape, bx, by, bw, bh);
    if (p) {
      ctx.stroke(p);
    } else {
      roundRect(ctx, bx, by, bw, bh, Math.max(0, radius - inner / 2));
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  clearShadow(ctx);
}

// --- Text layout ------------------------------------------------------------

// Height the wrapped block will occupy, without drawing it. Needed before the
// drawing pass, because a single-column Box centres its title + body as one
// block. An empty string occupies nothing, so a Box with only a title stays
// tight instead of reserving a blank line.
function measureTextBlock(ctx, text, w, opts) {
  if (text === undefined || text === null || String(text) === "") return 0;
  const fontSize = Number(opts.fontSize) || 14;
  const lineHeightPx = fontSize * (Number(opts.lineHeight) || 1.4);
  ctx.font = `${opts.fontWeight === "bold" ? "bold " : ""}${fontSize}px ${opts.fontFamily || "sans-serif"}`;
  return wrapText(ctx, String(text), Math.max(1, w)).length * lineHeightPx;
}

// Wraps like the browser's `word-break: break-word`: an explicit \n breaks,
// spaces break words, and a single token wider than the line is cut per
// character (CJK text has no spaces, so that path is the common one).
function wrapText(ctx, text, maxWidth) {
  const limit = Math.max(1, maxWidth);
  const lines = [];
  const paragraphs = String(text === undefined || text === null ? "" : text).split("\n");

  for (const paragraph of paragraphs) {
    const atoms = paragraph.match(/\s+|\S+/g) || [];
    let line = "";

    for (const atom of atoms) {
      if (line !== "" && ctx.measureText(line + atom).width > limit) {
        lines.push(line.replace(/\s+$/, ""));
        line = atom.replace(/^\s+/, "");
      } else {
        line += atom;
      }

      // Whatever is on the line is still too wide: cut it into fitted chunks.
      // `line.length > 1` keeps a single oversized glyph from looping forever.
      while (ctx.measureText(line).width > limit && line.length > 1) {
        let cut = line.length - 1;
        while (cut > 1 && ctx.measureText(line.slice(0, cut)).width > limit) cut--;
        lines.push(line.slice(0, cut));
        line = line.slice(cut);
      }
    }

    lines.push(line.replace(/\s+$/, ""));
  }

  return lines;
}

// Draws a wrapped block whose top-left corner is (x, y) and whose width is w.
// Returns the height the block occupied.
function drawTextBlock(ctx, text, x, y, w, opts) {
  const fontSize = Number(opts.fontSize) || 14;
  const lineHeightPx = fontSize * (Number(opts.lineHeight) || 1.4);

  ctx.font = `${opts.fontWeight === "bold" ? "bold " : ""}${fontSize}px ${opts.fontFamily || "sans-serif"}`;
  ctx.fillStyle = opts.color || "#333333";
  ctx.textAlign = opts.align || "left";
  ctx.textBaseline = "alphabetic";

  const lines = wrapText(ctx, text, w);
  const blockH = lines.length * lineHeightPx;

  // Baseline of the first line box, keeping the same offset the plain text
  // element has always exported with.
  const firstBaseline = y + fontSize;
  const anchorX = ctx.textAlign === "center" ? x + w / 2 : (ctx.textAlign === "right" ? x + w : x);

  lines.forEach((line, i) => {
    ctx.fillText(line, anchorX, firstBaseline + i * lineHeightPx);
  });

  return blockH;
}

// CSS `text-transform`, applied by hand. `capitalize` lifts the first letter of
// each word and, like CSS, deliberately leaves the rest of the word alone.
function applyTextTransform(text, transform) {
  const s = String(text === undefined || text === null ? "" : text);
  if (transform === "uppercase") return s.toUpperCase();
  if (transform === "lowercase") return s.toLowerCase();
  if (transform === "capitalize") return s.replace(/(^|\s)(\S)/g, (m, lead, ch) => lead + ch.toUpperCase());
  return s;
}

// --- Box columns ------------------------------------------------------------

// The rects a Box divides its content area into, in page pixels. Mirrors the
// flex rules exactly: the first column takes `split` of the main axis and the
// second one takes what is left after the gap.
function boxColumnRects(meta, area) {
  const w = Math.max(1, area.width);
  const h = Math.max(1, area.height);

  if (!meta.isSplit) {
    return [{ x: area.x, y: area.y, width: w, height: h }];
  }

  if (meta.layout === "columns") {
    const first = w * meta.split;
    const second = Math.max(1, w - first - meta.gap);
    return [
      { x: area.x, y: area.y, width: first, height: h },
      { x: area.x + first + meta.gap, y: area.y, width: second, height: h }
    ];
  }

  const first = h * meta.split;
  const second = Math.max(1, h - first - meta.gap);
  return [
    { x: area.x, y: area.y, width: w, height: first },
    { x: area.x, y: area.y + first + meta.gap, width: w, height: second }
  ];
}

// Title above body, inside one column. The pair is placed by `vAlign`, which is
// the exporter's `justify-content` on .box-column.
function drawBoxColumn(ctx, column, rect, meta, style) {
  // Each column carries its own horizontal align; a column that never set one
  // falls back to the box's `textAlign`, which is all a record could have had
  // before this field existed.
  const align = readColumnAlign(column, style);
  const bodyOpts = {
    fontSize: style.fontSize,
    fontWeight: style.fontWeight,
    color: style.color,
    align,
    lineHeight: style.lineHeight,
    fontFamily: style.fontFamily
  };
  const titleOpts = {
    fontSize: meta.titleFontSize,
    fontWeight: meta.titleFontWeight,
    color: meta.titleColor,
    align,
    lineHeight: style.lineHeight,
    fontFamily: style.fontFamily
  };

  const titleH = measureTextBlock(ctx, column.title, rect.width, titleOpts);
  const gap = titleH > 0 ? meta.titleGap : 0;
  const bodyH = measureTextBlock(ctx, column.body, rect.width, bodyOpts);

  // Mirror flex faithfully: a block taller than its column keeps its placement
  // (so it hangs out of the top) and is cut at the column's edges, which is what
  // `overflow: hidden` does in the preview. Snapping it back to the top when it
  // overflowed — the old behaviour — disagreed with the canvas exactly when the
  // user had the most text.
  const total = titleH + gap + bodyH;
  let top = rect.y;
  if (meta.vAlign === "middle") top = rect.y + (rect.height - total) / 2;
  else if (meta.vAlign === "bottom") top = rect.y + rect.height - total;

  ctx.save();
  ctx.beginPath();
  ctx.rect(rect.x, rect.y, rect.width, rect.height);
  ctx.clip();

  if (titleH > 0) {
    drawTextBlock(ctx, column.title, rect.x, top, rect.width, titleOpts);
    top += titleH + gap;
  }
  if (bodyH > 0) {
    drawTextBlock(ctx, column.body, rect.x, top, rect.width, bodyOpts);
  }

  ctx.restore();
}

// Small non-blocking toast, used only when a long page had to be scaled down so
// the user is not left wondering why the file is smaller than the canvas.
function showExportNotice(message) {
  const node = document.createElement("div");
  node.className = "export-notice";
  node.textContent = message;
  document.body.appendChild(node);
  setTimeout(() => node.remove(), 6000);
}

function downloadCanvas(canvas) {
  const link = document.createElement("a");
  link.download = "moe-bio.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}

</script>
<script>
function pushHistory() {
  const snapshot = {
    elements: JSON.parse(JSON.stringify(state.elements)),
    canvas: JSON.parse(JSON.stringify(state.canvas)),
    grid: JSON.parse(JSON.stringify(state.grid))
  };

  // If we're not at the end (undoed before), drop the rest
  if (state.history.index < state.history.stack.length - 1) {
    state.history.stack = state.history.stack.slice(0, state.history.index + 1);
  }

  state.history.stack.push(snapshot);
  state.history.index++;

  // Enforce max size
  if (state.history.stack.length > state.history.max) {
    state.history.stack.shift();
    state.history.index--;
  }
}

function undo() {
  if (state.history.index <= 0) return;
  if (state.crop && state.crop.active) exitCropMode(false);

  state.history.index--;
  applySnapshot(state.history.stack[state.history.index]);
}

function redo() {
  if (state.history.index >= state.history.stack.length - 1) return;
  if (state.crop && state.crop.active) exitCropMode(false);

  state.history.index++;
  applySnapshot(state.history.stack[state.history.index]);
}

function applySnapshot(snapshot) {
  state.elements = JSON.parse(JSON.stringify(snapshot.elements));
  state.canvas = JSON.parse(JSON.stringify(snapshot.canvas));
  state.grid = JSON.parse(JSON.stringify(snapshot.grid));
  state.selectedElementId = null;

  // Re-render everything
  const canvas = document.getElementById("canvas");
  if (canvas) {
    canvas.style.width = state.canvas.width + "px";
    canvas.style.height = state.canvas.height + "px";
    canvas.style.backgroundColor = state.canvas.background;
    if (state.canvas.backgroundImage) {
      canvas.style.backgroundImage = `url("${state.canvas.backgroundImage}")`;
      canvas.style.backgroundSize = "cover";
      canvas.style.backgroundPosition = "center";
    } else {
      canvas.style.backgroundImage = "none";
    }
    canvas.classList.toggle("grid-enabled", state.grid.enabled);
  }

  renderAllElements();
  // Long mode: the snapshot stores a derived height, so re-derive it. Runs
  // before the panel re-renders so the Height field shows the real value.
  syncPageHeight();
  renderPropertiesPanel();

  // Update grid/snap button labels
  const btnGrid = document.getElementById("btn-grid");
  if (btnGrid) btnGrid.textContent = state.grid.enabled ? "Grid: ON" : "Grid: OFF";
  const btnSnap = document.getElementById("btn-snap");
  if (btnSnap) btnSnap.textContent = state.grid.snap ? "Snap: ON" : "Snap: OFF";

  saveState();
}

function initHistory() {
  // Push initial state
  pushHistory();
}

</script>
<script>
const ALIGN_THRESHOLD = 5;

function checkAlignment(currentEl, newX, newY) {
  const guides = [];
  let snappedX = newX;
  let snappedY = newY;

  // Current element edges
  const curLeft = newX;
  const curRight = newX + currentEl.width;
  const curCenterX = newX + currentEl.width / 2;
  const curTop = newY;
  const curBottom = newY + currentEl.height;
  const curCenterY = newY + currentEl.height / 2;

  state.elements.forEach(other => {
    if (other.id === currentEl.id) return;

    const oLeft = other.x;
    const oRight = other.x + other.width;
    const oCenterX = other.x + other.width / 2;
    const oTop = other.y;
    const oBottom = other.y + other.height;
    const oCenterY = other.y + other.height / 2;

    // Vertical alignment (x-axis)
    const xChecks = [
      { cur: curLeft, other: oLeft, guide: oLeft },
      { cur: curRight, other: oRight, guide: oRight },
      { cur: curCenterX, other: oCenterX, guide: oCenterX },
      { cur: curLeft, other: oRight, guide: oRight },
      { cur: curRight, other: oLeft, guide: oLeft }
    ];

    for (const check of xChecks) {
      if (Math.abs(check.cur - check.other) < ALIGN_THRESHOLD) {
        const offset = check.other - check.cur;
        snappedX = newX + offset;
        guides.push({ type: "vertical", x: check.guide });
        break;
      }
    }

    // Horizontal alignment (y-axis)
    const yChecks = [
      { cur: curTop, other: oTop, guide: oTop },
      { cur: curBottom, other: oBottom, guide: oBottom },
      { cur: curCenterY, other: oCenterY, guide: oCenterY },
      { cur: curTop, other: oBottom, guide: oBottom },
      { cur: curBottom, other: oTop, guide: oTop }
    ];

    for (const check of yChecks) {
      if (Math.abs(check.cur - check.other) < ALIGN_THRESHOLD) {
        const offset = check.other - check.cur;
        snappedY = newY + offset;
        guides.push({ type: "horizontal", y: check.guide });
        break;
      }
    }
  });

  return { snappedX, snappedY, guides };
}

function renderGuides(guides) {
  clearGuides();
  const canvas = document.getElementById("canvas");
  if (!canvas) return;

  const layer = document.createElement("div");
  layer.className = "alignment-guides";
  layer.id = "alignment-guides";

  guides.forEach(g => {
    const line = document.createElement("div");
    if (g.type === "vertical") {
      line.className = "guide guide-vertical";
      line.style.left = g.x + "px";
    } else {
      line.className = "guide guide-horizontal";
      line.style.top = g.y + "px";
    }
    layer.appendChild(line);
  });

  canvas.appendChild(layer);
}

function clearGuides() {
  const layer = document.getElementById("alignment-guides");
  if (layer) layer.remove();
}

</script>
<script>
// Crop mode for image elements.
// The element's x/y/width/height IS the crop window, and content.crop stores
// how the image sits inside that window (offset + scale).

const MIN_CROP = 24;
const CROP_OUTLINE_COLOR = "#534ab7";

// The shapes the crop window can take. One list, shared by the crop toolbar and
// the properties panel, so the two can never drift into different vocabularies.
// The geometry itself lives in shapeSvgNode() / getClipPath(), which the canvas
// rendering uses too.
const CROP_SHAPES = [
  { id: "none", label: "矩形", title: "长方形裁剪框，宽高随意" },
  { id: "circle", label: "圆形", title: "正圆 / 椭圆" },
  { id: "heart", label: "心形", title: "心形，宽高随意拉伸" },
  { id: "star", label: "星形", title: "五角星" },
  { id: "diamond", label: "菱形", title: "菱形" },
  { id: "arch", label: "拱形", title: "上圆下方的拱形" },
  { id: "rounded", label: "圆角", title: "圆角矩形" }
];

// A shape is purely a clip now; keeping the frame square is its own button, so
// one control never means two things.
function normaliseShape(shape) {
  return (shape === "rect" || shape === "square" || !shape) ? "none" : shape;
}

function shapeDraft(d) {
  return normaliseShape(d.shape);
}

function enterCropMode(id) {
  const el = getElementById(id);
  if (!el || el.type !== "image") return;
  if (!el.content || !el.content.src) {
    alert("这张图片还没有内容，先上传一张图再裁剪");
    return;
  }

  if (el.content.naturalWidth && el.content.naturalHeight) {
    startCrop(el);
    return;
  }

  // Older elements never persisted the natural size, probe it once.
  const probe = new Image();
  probe.onload = () => {
    el.content.naturalWidth = probe.naturalWidth;
    el.content.naturalHeight = probe.naturalHeight;
    saveState();
    startCrop(el);
  };
  probe.onerror = () => alert("图片加载失败，无法裁剪");
  probe.src = el.content.src;
}

function startCrop(el) {
  const nw = el.content.naturalWidth;
  const nh = el.content.naturalHeight;
  const saved = el.content.crop;
  let draft;

  if (saved) {
    // Reopen from whatever the element looks like right now, so a frame that
    // was stretched since the last crop opens at its on-screen proportions.
    const geo = getCropGeometry(el);
    draft = {
      x: el.x,
      y: el.y,
      w: el.width,
      h: el.height,
      offsetX: geo.ix,
      offsetY: geo.iy,
      scaleX: nw ? geo.dw / nw : 1,
      scaleY: nh ? geo.dh / nh : 1,
      shape: normaliseShape(getImageShape(el))
    };
  } else {
    // Start from the exact rect the image occupies today (contain), so nothing jumps.
    const scale = Math.min(el.width / nw, el.height / nh);
    const dw = nw * scale;
    const dh = nh * scale;

    draft = {
      x: Math.round(el.x + (el.width - dw) / 2),
      y: Math.round(el.y + (el.height - dh) / 2),
      w: Math.round(dw),
      h: Math.round(dh),
      offsetX: 0,
      offsetY: 0,
      scaleX: scale,
      scaleY: scale,
      shape: normaliseShape(getImageShape(el))
    };
  }

  state.crop.active = true;
  state.crop.elementId = el.id;
  state.crop.shape = draft.shape;
  state.crop.draft = draft;

  const domEl = document.querySelector(`[data-element-id="${el.id}"]`);
  if (domEl) domEl.classList.add("cropping");

  clearGuides();
  setSelectedElementId(el.id);
  buildCropOverlay();
  renderCropOverlay();
  renderCropToolbar();
}

function buildCropOverlay() {
  const canvas = document.getElementById("canvas");
  if (!canvas) return;

  const el = getElementById(state.crop.elementId);
  if (!el) return;

  const existing = document.getElementById("crop-overlay");
  if (existing) existing.remove();

  const overlay = document.createElement("div");
  overlay.className = "crop-overlay";
  overlay.id = "crop-overlay";

  const ghost = document.createElement("img");
  ghost.className = "crop-ghost";
  ghost.id = "crop-ghost";
  ghost.draggable = false;
  ghost.src = el.content.src;
  overlay.appendChild(ghost);

  const win = document.createElement("div");
  win.className = "crop-window";
  win.id = "crop-window";
  const clipImg = document.createElement("img");
  clipImg.className = "crop-clip-img";
  clipImg.id = "crop-clip-img";
  clipImg.draggable = false;
  clipImg.src = el.content.src;
  win.appendChild(clipImg);
  overlay.appendChild(win);

  const hit = document.createElement("div");
  hit.className = "crop-window-hit";
  hit.id = "crop-window-hit";
  hit.addEventListener("pointerdown", startCropPan);
  overlay.appendChild(hit);

  const ns = "http://www.w3.org/2000/svg";
  const outline = document.createElementNS(ns, "svg");
  outline.setAttribute("id", "crop-outline");
  outline.setAttribute("class", "crop-outline");
  overlay.appendChild(outline);

  ["nw", "ne", "sw", "se"].forEach(dir => {
    const handle = document.createElement("div");
    handle.className = `crop-handle crop-handle-${dir}`;
    handle.dataset.cropHandle = dir;
    handle.addEventListener("pointerdown", (e) => startCropResize(e, dir));
    overlay.appendChild(handle);
  });

  canvas.appendChild(overlay);
}

function renderCropOverlay() {
  const d = state.crop.draft;
  const el = getElementById(state.crop.elementId);
  if (!d || !el) return;

  const dw = el.content.naturalWidth * d.scaleX;
  const dh = el.content.naturalHeight * d.scaleY;

  const ghost = document.getElementById("crop-ghost");
  if (ghost) {
    ghost.style.left = (d.x + d.offsetX) + "px";
    ghost.style.top = (d.y + d.offsetY) + "px";
    ghost.style.width = dw + "px";
    ghost.style.height = dh + "px";
  }

  const win = document.getElementById("crop-window");
  if (win) {
    win.style.left = d.x + "px";
    win.style.top = d.y + "px";
    win.style.width = d.w + "px";
    win.style.height = d.h + "px";
    const clip = getClipPath(d.shape);
    win.style.clipPath = clip || "none";
    win.style.webkitClipPath = clip || "none";
  }

  const clipImg = document.getElementById("crop-clip-img");
  if (clipImg) {
    clipImg.style.left = d.offsetX + "px";
    clipImg.style.top = d.offsetY + "px";
    clipImg.style.width = dw + "px";
    clipImg.style.height = dh + "px";
  }

  const hit = document.getElementById("crop-window-hit");
  if (hit) {
    hit.style.left = d.x + "px";
    hit.style.top = d.y + "px";
    hit.style.width = d.w + "px";
    hit.style.height = d.h + "px";
  }

  renderCropOutline();
  positionCropHandles();
}

function renderCropOutline() {
  const d = state.crop.draft;
  const svg = document.getElementById("crop-outline");
  if (!svg || !d) return;

  const ns = "http://www.w3.org/2000/svg";
  svg.setAttribute("viewBox", `0 0 ${d.w} ${d.h}`);
  svg.style.left = d.x + "px";
  svg.style.top = d.y + "px";
  svg.style.width = d.w + "px";
  svg.style.height = d.h + "px";

  while (svg.firstChild) svg.removeChild(svg.firstChild);

  // Same builder the canvas and the shape layer use, so the dashed guide always
  // sits on the outline the photo will actually keep.
  let shape = shapeSvgNode(normaliseShape(d.shape), d.w, d.h);
  if (!shape) {
    shape = document.createElementNS(ns, "rect");
    shape.setAttribute("x", 0);
    shape.setAttribute("y", 0);
    shape.setAttribute("width", d.w);
    shape.setAttribute("height", d.h);
  }

  shape.setAttribute("fill", "none");
  shape.setAttribute("stroke", CROP_OUTLINE_COLOR);
  shape.setAttribute("stroke-width", "1.5");
  shape.setAttribute("stroke-dasharray", "6 4");
  shape.setAttribute("vector-effect", "non-scaling-stroke");
  svg.appendChild(shape);
}

function positionCropHandles() {
  const d = state.crop.draft;
  const overlay = document.getElementById("crop-overlay");
  if (!overlay || !d) return;

  overlay.querySelectorAll(".crop-handle").forEach(handle => {
    const dir = handle.dataset.cropHandle;
    handle.style.left = (dir.includes("w") ? d.x : d.x + d.w) + "px";
    handle.style.top = (dir.includes("n") ? d.y : d.y + d.h) + "px";
  });
}

function renderCropToolbar() {
  const existing = document.getElementById("crop-toolbar");
  if (existing) existing.remove();

  const bar = document.createElement("div");
  bar.className = "crop-toolbar";
  bar.id = "crop-toolbar";

  const shapes = document.createElement("div");
  shapes.className = "crop-toolbar-group";
  CROP_SHAPES.forEach(item => {
    const btn = document.createElement("button");
    btn.className = "crop-shape-btn" + (shapeDraft(state.crop.draft) === item.id ? " active" : "");
    btn.textContent = item.label;
    btn.title = item.title;
    btn.addEventListener("click", () => setCropShape(item.id));
    shapes.appendChild(btn);
  });

  // Keeping the window square is its own button: a shape should only ever mean
  // "what outline", never "snap my width and height".
  const square = document.createElement("button");
  square.className = "crop-shape-btn";
  square.textContent = "1:1";
  square.title = "把裁剪框摆成正方形，之后仍可自由拉伸";
  square.addEventListener("click", () => snapCropToSquare());
  shapes.appendChild(square);

  const hint = document.createElement("span");
  hint.className = "crop-hint";
  hint.textContent = "拖控制点自由拉宽高 · 按住 Shift 保持 1:1";
  shapes.appendChild(hint);

  const actions = document.createElement("div");
  actions.className = "crop-toolbar-group";

  const cancel = document.createElement("button");
  cancel.className = "btn btn-secondary";
  cancel.textContent = "取消";
  cancel.addEventListener("click", () => exitCropMode(false));
  actions.appendChild(cancel);

  const done = document.createElement("button");
  done.className = "btn btn-primary";
  done.textContent = "完成";
  done.addEventListener("click", () => exitCropMode(true));
  actions.appendChild(done);

  bar.appendChild(shapes);
  bar.appendChild(actions);
  document.body.appendChild(bar);
}

function snapCropToSquare() {
  const d = state.crop.draft;
  if (!d) return;
  const size = Math.min(d.w, d.h);
  d.x += (d.w - size) / 2;
  d.y += (d.h - size) / 2;
  d.w = size;
  d.h = size;
  clampCropDraft();
  renderCropOverlay();
}

function startCropPan(e) {
  if (!state.crop.active) return;
  e.preventDefault();
  e.stopPropagation();

  const d = state.crop.draft;
  const el = getElementById(state.crop.elementId);
  if (!d || !el) return;

  const startX = e.clientX;
  const startY = e.clientY;
  const startOffsetX = d.offsetX;
  const startOffsetY = d.offsetY;
  // Where the window itself sat. Anchoring the second half of the gesture here
  // (rather than accumulating) keeps back-and-forth dragging from drifting.
  const baseX = d.x;
  const baseY = d.y;

  const move = (ev) => {
    // The draft lives in page units, the pointer in screen pixels.
    const wantX = toCanvasDelta(ev.clientX - startX);
    const wantY = toCanvasDelta(ev.clientY - startY);

    // First choice: slide the photo inside the window. That is what cropping is
    // usually about, and once the frame is smaller than the photo it is the only
    // thing that can move.
    d.offsetX = startOffsetX + wantX;
    d.offsetY = startOffsetY + wantY;
    clampCropDraft();

    // Whatever the clamp refused becomes a move of the whole window instead.
    // Without this the gesture dies as soon as the photo exactly fills the frame
    // — which is precisely how every crop opens — so dragging appeared to do
    // absolutely nothing.
    const leftoverX = (startOffsetX + wantX) - d.offsetX;
    const leftoverY = (startOffsetY + wantY) - d.offsetY;
    if (leftoverX !== 0 || leftoverY !== 0) {
      d.x = baseX + leftoverX;
      d.y = baseY + leftoverY;
      clampCropDraft();
    }

    renderCropOverlay();
  };

  const up = () => {
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    document.removeEventListener("pointercancel", up);
  };

  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
  document.addEventListener("pointercancel", up);
}

function startCropResize(e, dir) {
  if (!state.crop.active) return;
  e.preventDefault();
  e.stopPropagation();

  const d = state.crop.draft;
  const startX = e.clientX;
  const startY = e.clientY;
  const base = { x: d.x, y: d.y, w: d.w, h: d.h, offsetX: d.offsetX, offsetY: d.offsetY };

  const move = (ev) => {
    const dx = toCanvasDelta(ev.clientX - startX);
    const dy = toCanvasDelta(ev.clientY - startY);

    let x = base.x;
    let y = base.y;
    let w = base.w;
    let h = base.h;

    if (dir.includes("e")) w = base.w + dx;
    if (dir.includes("w")) {
      w = base.w - dx;
      x = base.x + dx;
    }
    if (dir.includes("s")) h = base.h + dy;
    if (dir.includes("n")) {
      h = base.h - dy;
      y = base.y + dy;
    }

    w = Math.max(MIN_CROP, w);
    h = Math.max(MIN_CROP, h);

    // Width and height are independent by default. Hold Shift to keep them equal.
    if (ev.shiftKey) {
      const size = Math.max(w, h);
      if (dir.includes("w")) x = base.x + base.w - size;
      if (dir.includes("n")) y = base.y + base.h - size;
      w = size;
      h = size;
    }

    // Moving a top/left edge shifts the window, compensate so the image stays put.
    let offsetX = base.offsetX;
    let offsetY = base.offsetY;
    if (dir.includes("w")) offsetX = base.offsetX - (x - base.x);
    if (dir.includes("n")) offsetY = base.offsetY - (y - base.y);

    d.x = x;
    d.y = y;
    d.w = w;
    d.h = h;
    d.offsetX = offsetX;
    d.offsetY = offsetY;

    clampCropDraft();
    renderCropOverlay();
  };

  const up = () => {
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    document.removeEventListener("pointercancel", up);
  };

  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
  document.addEventListener("pointercancel", up);
}

function clampCropDraft() {
  const d = state.crop.draft;
  const el = getElementById(state.crop.elementId);
  if (!d || !el) return;

  const dw = el.content.naturalWidth * d.scaleX;
  const dh = el.content.naturalHeight * d.scaleY;

  d.w = Math.min(d.w, dw, state.canvas.width);
  d.h = Math.min(d.h, dh, state.canvas.height);
  d.w = Math.max(MIN_CROP, d.w);
  d.h = Math.max(MIN_CROP, d.h);

  d.x = Math.max(0, Math.min(d.x, state.canvas.width - d.w));
  d.y = Math.max(0, Math.min(d.y, state.canvas.height - d.h));

  // The image must always cover the window, no empty gaps.
  d.offsetX = Math.min(0, Math.max(d.w - dw, d.offsetX));
  d.offsetY = Math.min(0, Math.max(d.h - dh, d.offsetY));
}

function setCropShape(shape) {
  const d = state.crop.draft;
  if (!d) return;

  // Draft only. The overlay draws the outline live, and the element itself is
  // written when the crop is applied — cancelling must leave the shape alone.
  d.shape = normaliseShape(shape);
  state.crop.shape = d.shape;

  renderCropOverlay();
  renderCropToolbar();
}

function exitCropMode(apply) {
  const el = getElementById(state.crop.elementId);
  const d = state.crop.draft;

  if (apply && el && d) {
    el.x = Math.round(d.x);
    el.y = Math.round(d.y);
    el.width = Math.round(d.w);
    el.height = Math.round(d.h);
    const round = (v) => Math.round(v * 10000) / 10000;
    const dw = el.content.naturalWidth * d.scaleX;
    const dh = el.content.naturalHeight * d.scaleY;
    // Geometry only — the shape lives in el.style.cropShape.
    el.content.crop = {
      ix: round(d.offsetX / d.w),
      iy: round(d.offsetY / d.h),
      iw: round(dw / d.w),
      ih: round(dh / d.h)
    };
    el.style.cropShape = shapeDraft(d);
  }

  state.crop.active = false;
  state.crop.elementId = null;
  state.crop.shape = "none";
  state.crop.draft = null;

  const overlay = document.getElementById("crop-overlay");
  if (overlay) overlay.remove();
  const bar = document.getElementById("crop-toolbar");
  if (bar) bar.remove();
  document.querySelectorAll(".canvas-element.cropping").forEach(node => node.classList.remove("cropping"));

  if (el) {
    if (apply) {
      rerenderElement(el);
      saveState();
      pushHistory();
    }
    setSelectedElementId(el.id);
  } else {
    renderPropertiesPanel();
  }
}

function clearCrop(id) {
  const el = getElementById(id);
  if (!el || !el.content) return;
  el.content.crop = null;
  saveState();
  pushHistory();
  rerenderElement(el);
  renderPropertiesPanel();
}

</script>
<script>
// Dragging the divider inside a split Box. Deliberately the same shape as
// resize.js: the pointerdown picks the divider, the move / up handlers live on
// `document` so the drag survives the pointer leaving the element.
//
// drag.js also bails out on `.column-splitter`, so the two never fight over the
// same gesture.

const MIN_SPLIT = 0.15;
const MAX_SPLIT = 0.85;

function initColumns() {
  const canvas = document.getElementById("canvas");
  if (!canvas) return;
  canvas.addEventListener("pointerdown", onSplitterDown);
}

let splitMoveHandler = null;
let splitUpHandler = null;

function onSplitterDown(e) {
  if (state.crop && state.crop.active) return;
  if (!e.target.classList.contains("column-splitter")) return;

  const domEl = e.target.closest(".canvas-element");
  if (!domEl) return;

  const el = getElementById(domEl.dataset.elementId);
  if (!el || el.type !== "textbox") return;

  const meta = readBoxLayout(el.style);
  if (!meta.isSplit) return;

  const body = e.target.parentElement;
  if (!body) return;

  const rect = body.getBoundingClientRect();
  const axis = meta.layout === "columns" ? "x" : "y";
  const extent = axis === "x" ? rect.width : rect.height;
  if (!(extent > 0)) return;

  e.preventDefault();
  e.stopPropagation();

  state.split.active = true;
  state.split.elementId = el.id;
  state.split.axis = axis;
  state.split.startClient = axis === "x" ? e.clientX : e.clientY;
  state.split.startSplit = meta.split;
  state.split.extent = extent;

  // Without this the cursor flips back to the element's own `move` halfway
  // through the drag whenever the pointer leaves the 11px divider.
  document.body.style.cursor = axis === "x" ? "col-resize" : "row-resize";

  splitMoveHandler = (ev) => onSplitterMove(ev, el, body);
  splitUpHandler = () => onSplitterUp();

  document.addEventListener("pointermove", splitMoveHandler);
  document.addEventListener("pointerup", splitUpHandler);
  document.addEventListener("pointercancel", splitUpHandler);
}

function onSplitterMove(e, el, body) {
  if (!state.split.active) return;
  e.preventDefault();

  const client = state.split.axis === "x" ? e.clientX : e.clientY;
  const delta = (client - state.split.startClient) / state.split.extent;
  const split = Math.min(MAX_SPLIT, Math.max(MIN_SPLIT, state.split.startSplit + delta));

  el.style.split = Math.round(split * 1000) / 1000;
  // Writing the variable directly keeps the drag off the re-render path.
  body.style.setProperty("--split", (el.style.split * 100) + "%");

  const slider = document.querySelector('.range-input[data-field="style.split"]');
  if (slider) {
    const percent = Math.round(el.style.split * 100);
    slider.value = percent;
    const readout = slider.parentElement?.querySelector(".range-value");
    if (readout) readout.textContent = percent + "%";
  }
}

function onSplitterUp() {
  if (!state.split.active) return;

  state.split.active = false;
  state.split.elementId = null;

  document.removeEventListener("pointermove", splitMoveHandler);
  document.removeEventListener("pointerup", splitUpHandler);
  document.removeEventListener("pointercancel", splitUpHandler);
  splitMoveHandler = null;
  splitUpHandler = null;

  document.body.style.cursor = "";
  saveState();
  pushHistory();
}

</script>
<script>
function initCanvas() {
  const canvas = document.getElementById("canvas");
  if (!canvas) return;

  canvas.style.width = state.canvas.width + "px";
  canvas.style.height = state.canvas.height + "px";
  canvas.style.backgroundColor = state.canvas.background;
  if (state.canvas.backgroundImage) {
    canvas.style.backgroundImage = `url("${state.canvas.backgroundImage}")`;
    canvas.style.backgroundSize = "cover";
    canvas.style.backgroundPosition = "center";
  }
}

// Compact "colour + transparency" control: swatch, alpha slider, percentage.
// Alpha lives as 0..1 in state but the slider runs 0..100 for a nicer feel.
function colorAlphaRow(color, alpha, colorField, alphaField) {
  // "transparent" reads as alpha 0 rather than as an opaque white swatch, so
  // the slider always tells the truth about what is on screen.
  const isTransparent = !color || color === "transparent";
  const hex = isTransparent ? "#ffffff" : color;
  const pct = isTransparent ? 0 : Math.round((alpha === undefined || alpha === null ? 1 : Number(alpha)) * 100);
  return `
    <div class="color-alpha">
      <input type="color" class="color-input" value="${hex}" data-field="${colorField}">
      <input type="range" class="alpha-range" min="0" max="100" step="1" value="${pct}" data-field="${alphaField}" data-unit="%">
      <span class="alpha-value">${pct}%</span>
    </div>
  `;
}

// One Box column: an optional title above a body. The field name carries the
// column index so `onPropertyInput` can route it back without extra state.
function columnFields(index, label, column, align) {
  return `
    <div class="property-group">
      <label class="property-label">${label}</label>
      <input type="text" class="property-input box-title-input" id="prop-col${index}-title" placeholder="Title" value="${escapeHtml(column.title)}" data-field="box.${index}.title">
      <textarea class="property-input box-body-input" id="prop-col${index}-body" rows="3" placeholder="Body" data-field="box.${index}.body">${escapeHtml(column.body)}</textarea>
      <div class="segmented" style="margin-top:6px;">
        <button class="segmented-btn ${align === "left" ? "active" : ""}" data-colalign="left" data-col="${index}" title="这一栏的标题与正文左对齐">L</button>
        <button class="segmented-btn ${align === "center" ? "active" : ""}" data-colalign="center" data-col="${index}" title="这一栏的标题与正文居中">C</button>
        <button class="segmented-btn ${align === "right" ? "active" : ""}" data-colalign="right" data-col="${index}" title="这一栏的标题与正文右对齐">R</button>
      </div>
    </div>
  `;
}

// A slider with a tiny inline prefix, used for widths under a colour row.
function slimRange(prefix, value, field, min, max, title, unit) {
  return `
    <div class="range-wrapper slim"${title ? ` title="${title}"` : ""}>
      <span class="range-prefix">${prefix}</span>
      <input type="range" class="range-input" min="${min}" max="${max}" value="${value}"${unit ? ` data-unit="${unit}"` : ""} data-field="${field}">
      <span class="range-value">${value}${unit || ""}</span>
    </div>
  `;
}

// Text typed on the canvas goes back into panel inputs and textareas, so a
// quote or an angle bracket must not be able to break the panel's markup.
function escapeHtml(value) {
  return String(value === undefined || value === null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// Every slider does exactly one thing, so no preset buttons are needed:
//   X / Y  move the shadow        S  spreads it (fatter / thinner)
//   B      blurs its edge
function shadowGroup(style) {
  const x = Number(style.shadowX) || 0;
  const y = Number(style.shadowY) || 0;
  const blur = Math.max(0, Number(style.shadowBlur) || 0);
  const spread = Number(style.shadowSpread) || 0;
  return `
    <div class="property-group">
      <label class="property-label">Shadow</label>
      ${colorAlphaRow(style.shadowColor || "#000000", style.shadowAlpha, "style.shadowColor", "style.shadowAlpha")}
      ${slimRange("X", x, "style.shadowX", -40, 40, "横向偏移，负数向左")}
      ${slimRange("Y", y, "style.shadowY", -40, 40, "纵向偏移，负数向上")}
      ${slimRange("B", blur, "style.shadowBlur", 0, 40, "模糊半径，0 = 边缘锐利")}
      ${slimRange("S", spread, "style.shadowSpread", -30, 30, "粗细：正数让阴影比元素胖一圈，负数瘦一圈")}
    </div>
  `;
}

function renderPropertiesPanel() {
  const panel = document.getElementById("properties-panel");
  if (!panel) return;

  const el = getSelectedElement();

  if (!el) {
    const bg = state.canvas.background;
    const hasBgImage = !!state.canvas.backgroundImage;
    const isLong = isLongPage();
    const ratios = ["1:1", "3:4", "4:3", "9:16", "custom"];
    const gap = getPageBottomGap();
    panel.innerHTML = `
      <h3 class="panel-title">Page</h3>
      <div class="property-group">
        <label class="property-label">Page Mode</label>
        <div class="segmented">
          <button class="segmented-btn ${isLong ? "" : "active"}" data-pagemode="fixed">固定画布</button>
          <button class="segmented-btn ${isLong ? "active" : ""}" data-pagemode="long">纵向长页</button>
        </div>
        <p class="property-hint">${isLong ? "高度随内容自动增长，适合长图 / 主页" : "宽高固定，适合单张卡片"}</p>
      </div>
      ${isLong ? "" : `
      <div class="property-group">
        <label class="property-label">Ratio</label>
        <div class="segmented">
          ${ratios.map(r => `
            <button class="segmented-btn ${state.canvas.ratio === r ? "active" : ""}" data-ratio="${r}" title="${r === "custom" ? "自定义比例" : r}">${r === "custom" ? "自定" : r}</button>
          `).join("")}
        </div>
      </div>`}
      <div class="property-group">
        <label class="property-label">Size</label>
        <div class="property-row">
          <div class="property-group">
            <label class="property-label">Width</label>
            <input type="number" class="property-input" id="canvas-width" value="${state.canvas.width}" min="200" max="2000">
          </div>
          <div class="property-group">
            <label class="property-label">Height</label>
            <input type="number" class="property-input" id="canvas-height" value="${Math.round(state.canvas.height)}" min="200" max="5000" ${isLong ? 'readonly title="纵向长页模式下高度由内容决定"' : ""}>
          </div>
        </div>
      </div>
      ${isLong ? `
      <div class="property-group">
        <label class="property-label">Bottom Gap</label>
        <div class="range-wrapper">
          <input type="range" class="range-input" id="canvas-bottom-gap" min="10" max="400" step="10" value="${gap}">
          <span class="range-value">${gap}</span>
        </div>
      </div>
      <div class="property-group">
        <label class="property-label">Layout</label>
        <button class="btn btn-secondary" id="canvas-tidy" style="width:100%;" ${state.elements.length ? "" : "disabled"}>整理成列表</button>
        <p class="property-hint">按纵向位置重排：统一左对齐、间距 ${TIDY_GAP}px。可撤销</p>
      </div>` : ""}
      <div class="property-group">
        <label class="property-label">Background Color</label>
        <div class="color-wrapper">
          <input type="color" class="color-input" id="canvas-bg-color" value="${bg}">
          <span>${bg}</span>
        </div>
      </div>
      <div class="property-group">
        <label class="property-label">Background Image</label>
        <button class="btn btn-secondary btn-upload" id="canvas-bg-upload">${hasBgImage ? "Change Image" : "Upload Image"}</button>
        ${hasBgImage ? '<button class="btn btn-secondary" id="canvas-bg-clear" style="margin-top:6px;width:100%;">Clear Image</button>' : ""}
        <input type="file" id="canvas-bg-file" accept="image/*" hidden>
      </div>
    `;

    // Page mode. Switching never touches the elements: fixed → long immediately
    // re-derives the height from the content, long → fixed freezes it as a
    // user-owned value (and drops the ratio, which no longer describes the box).
    panel.querySelectorAll("[data-pagemode]").forEach(btn => {
      btn.addEventListener("click", () => {
        const mode = btn.dataset.pagemode;
        if (state.canvas.mode === mode) return;
        state.canvas.mode = mode;
        if (mode === "long") {
          syncPageHeight();
        } else {
          markRatioCustom();
          applyCanvasSize();
        }
        saveState();
        pushHistory();
        renderPropertiesPanel();
      });
    });

    panel.querySelectorAll("[data-ratio]").forEach(btn => {
      btn.addEventListener("click", () => {
        const ratio = btn.dataset.ratio;
        if (ratio === "custom") {
          markRatioCustom();
        } else {
          applyPageRatio(ratio);
        }
        saveState();
        pushHistory();
        renderPropertiesPanel();
      });
    });

    const bgColor = document.getElementById("canvas-bg-color");
    if (bgColor) {
      bgColor.addEventListener("input", (e) => {
        setCanvasBackground(e.target.value);
        e.target.parentElement.querySelector("span").textContent = e.target.value;
        saveState();
      });
    }

    const bgUpload = document.getElementById("canvas-bg-upload");
    const bgFile = document.getElementById("canvas-bg-file");
    if (bgUpload && bgFile) {
      bgUpload.addEventListener("click", () => bgFile.click());
      bgFile.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setCanvasBackgroundImage(ev.target.result);
          saveState();
          renderPropertiesPanel();
        };
        reader.readAsDataURL(file);
      });
    }

    const bgClear = document.getElementById("canvas-bg-clear");
    if (bgClear) {
      bgClear.addEventListener("click", () => {
        setCanvasBackgroundImage(null);
        saveState();
        renderPropertiesPanel();
      });
    }

    const cw = document.getElementById("canvas-width");
    const ch = document.getElementById("canvas-height");
    if (cw) {
      cw.addEventListener("change", (e) => {
        const val = Math.max(120, parseInt(e.target.value, 10) || 600);
        state.canvas.width = val;
        // A fixed page keeps its ratio: width drives height. A long page has a
        // derived height, so width alone changes.
        if (!isLongPage() && state.canvas.ratio !== "custom") {
          applyPageRatio(state.canvas.ratio);
        } else {
          applyCanvasSize();
          if (isLongPage()) syncPageHeight();
        }
        saveState();
        e.target.value = state.canvas.width;
      });
    }
    if (ch) {
      ch.addEventListener("change", (e) => {
        if (isLongPage()) {
          // Read-only in long mode; snap the field back to the derived value.
          refreshPageHeightField();
          return;
        }
        const val = Math.max(120, parseInt(e.target.value, 10) || 900);
        state.canvas.height = val;
        markRatioCustom();
        applyCanvasSize();
        saveState();
        renderPropertiesPanel();
      });
    }

    const cg = document.getElementById("canvas-bottom-gap");
    if (cg) {
      cg.addEventListener("input", (e) => {
        state.canvas.bottomGap = parseInt(e.target.value, 10) || 0;
        const readout = e.target.parentElement.querySelector(".range-value");
        if (readout) readout.textContent = state.canvas.bottomGap;
        syncPageHeight();
        saveState();
      });
    }

    // One-click tidy-up. Positions only — nothing is resized, restyled or
    // reordered in z, and the whole pass is a single undo step.
    const tidyBtn = document.getElementById("canvas-tidy");
    if (tidyBtn) {
      tidyBtn.addEventListener("click", () => {
        if (!tidyIntoList()) return;
        saveState();
        pushHistory();
        renderPropertiesPanel();
      });
    }

    return;
  }

  let html = `<h3 class="panel-title">Properties</h3>`;

  // Common: Position & Size
  html += `
    <div class="property-row">
      <div class="property-group">
        <label class="property-label">X</label>
        <input type="number" class="property-input" id="prop-x" value="${Math.round(el.x)}" data-field="x">
      </div>
      <div class="property-group">
        <label class="property-label">Y</label>
        <input type="number" class="property-input" id="prop-y" value="${Math.round(el.y)}" data-field="y">
      </div>
    </div>
    <div class="property-row">
      <div class="property-group">
        <label class="property-label">Width</label>
        <input type="number" class="property-input" id="prop-width" value="${Math.round(el.width)}" data-field="width">
      </div>
      <div class="property-group">
        <label class="property-label">Height</label>
        <input type="number" class="property-input" id="prop-height" value="${Math.round(el.height)}" data-field="height">
      </div>
    </div>
  `;

  // Type-specific properties
  if (el.type === "text") {
    html += `
      <div class="property-group">
        <label class="property-label">Content</label>
        <textarea class="property-input" id="prop-content" rows="3" data-field="content">${el.content}</textarea>
      </div>
      <div class="property-group">
        <label class="property-label">Font Size</label>
        <div class="range-wrapper">
          <input type="range" class="range-input" id="prop-fontSize" min="8" max="120" value="${el.style.fontSize}" data-field="style.fontSize">
          <span class="range-value">${el.style.fontSize}</span>
        </div>
      </div>
      <div class="property-group">
        <label class="property-label">Weight</label>
        <div class="segmented">
          <button class="segmented-btn ${el.style.fontWeight === "normal" ? "active" : ""}" data-weight="normal">Normal</button>
          <button class="segmented-btn ${el.style.fontWeight === "bold" ? "active" : ""}" data-weight="bold">Bold</button>
        </div>
      </div>
      <div class="property-group">
        <label class="property-label">Color</label>
        <div class="color-wrapper">
          <input type="color" class="color-input" id="prop-color" value="${el.style.color}" data-field="style.color">
          <span>${el.style.color}</span>
        </div>
      </div>
      <div class="property-group">
        <label class="property-label">Align</label>
        <div class="segmented">
          <button class="segmented-btn ${el.style.textAlign === "left" ? "active" : ""}" data-align="left">L</button>
          <button class="segmented-btn ${el.style.textAlign === "center" ? "active" : ""}" data-align="center">C</button>
          <button class="segmented-btn ${el.style.textAlign === "right" ? "active" : ""}" data-align="right">R</button>

      </div>
      <div class="property-group">
        <label class="property-label">Opacity</label>
        <div class="range-wrapper">

    // One panel for one element type: photo, frame and crop all live here. The

    const crop = el.content && el.content.crop;

    const locked = s.lockAspectRatio !== false;

    const boxStyles = ["default", "dashed"];

      none: "矩形",

      circle: "圆形",

      star: "星形",
      diamond: "菱形",
      arch: "拱形"
    };
    const padding = readPadding(s, 0);

    html += `
      <div class="property-group">
        <label class="property-label">Image</label>

      </div>
      <div class="property-group">
        <label class="property-label">Crop</label>
        <button class="btn btn-secondary btn-upload" id="btn-crop">${crop ? "重新裁剪" : "裁剪"}</button>
        ${crop ? `<div class="crop-info">已裁剪 · ${shapeLabels[shape] || shapeLabels.none}</div>

      </div>
      <div class="property-group">
        <label class="property-label">Shape</label>
        <div class="shape-grid">
          ${shapes.map(item => `
            <button class="shape-btn ${(shape || "none") === item ? "active" : ""}" data-shape="${item}" title="${shapeLabels[item]}">
              <span class="shape-preview shape-${item}"></span>
            </button>
          `).join("")}
        </div>
        <p class="property-hint">只换轮廓，不动图片内容</p>
      </div>
    `;

    // Fit only matters while the whole photo is on show; a crop decides what is
    // visible instead.
    if (!crop) {
      html += `
        <div class="property-group">
          <label class="property-label">Image Fit</label>
          <div class="segmented">
            <button class="segmented-btn ${fit === "cover" ? "active" : ""}" data-fit="cover">Cover</button>
            <button class="segmented-btn ${fit === "contain" ? "active" : ""}" data-fit="contain">Contain</button>
            <button class="segmented-btn ${fit === "fill" ? "active" : ""}" data-fit="fill">Fill</button>
          </div>
        </div>
      `;
    }

    html += `
      <div class="property-group">
        <label class="property-label">Frame</label>
        <div class="style-grid">
          ${boxStyles.map(style => `
            <button class="style-btn ${s.boxStyle === style ? "active" : ""}" data-boxstyle="${style}" title="${style}">

      </div>
      <div class="property-group">
        <label class="property-label">Lock Aspect Ratio</label>
        <div class="segmented">
          <button class="segmented-btn ${locked ? "active" : ""}" data-aspect="true">锁定</button>
          <button class="segmented-btn ${!locked ? "active" : ""}" data-aspect="false">自由</button>
        </div>
      </div>
      <div class="property-group">
        <label class="property-label">Padding</label>
        ${slimRange("H", padding.h, "style.paddingH", 0, 60, "左右内边距")}
        ${slimRange("V", padding.v, "style.paddingV", 0, 60, "上下内边距")}
      </div>
      <div class="property-group">
        <label class="property-label">Background</label>
        ${colorAlphaRow(s.backgroundColor, s.backgroundAlpha, "style.backgroundColor", "style.backgroundAlpha")}
      </div>
      <div class="property-group">
        <label class="property-label">${shape ? "Inner Border (跟随形状)" : "Inner Border"}</label>
        ${colorAlphaRow(s.borderColor, s.borderAlpha, "style.borderColor", "style.borderAlpha")}
        ${slimRange("W", s.borderWidth || 0, "style.borderWidth", 0, 20)}
      </div>
      <div class="property-group">
        <label class="property-label">Outer Border</label>
        ${colorAlphaRow(s.borderOuterColor || "#333333", s.borderOuterAlpha, "style.borderOuterColor", "style.borderOuterAlpha")}
        ${slimRange("W", s.borderOuterWidth || 0, "style.borderOuterWidth", 0, 20)}
      </div>
      ${shadowGroup(s)}

    // A shape owns the corners, so Radius would be a dead control while one is on.
    if (!shape) {
      html += `
        <div class="property-group">

            <input type="range" class="range-input" id="prop-radius" min="0" max="${Math.min(el.width, el.height) / 2}" value="${s.borderRadius}" data-field="style.borderRadius">
            <span class="range-value">${s.borderRadius}</span>
          </div>
        </div>
      `;
    }

    html += `
      <div class="property-group">
        <label class="property-label">Opacity</label>
        <div class="range-wrapper">
          <input type="range" class="range-input" id="prop-opacity" min="0" max="1" step="0.05" value="${s.opacity}" data-field="style.opacity">
          <span class="range-value">${Math.round(s.opacity * 100)}%</span>
        </div>
      </div>
    `;
  } else if (el.type === "sticker") {
    html += `
      <div class="property-group">
        <label class="property-label">Content</label>
        <input type="text" class="property-input" id="prop-content" value="${el.content}" data-field="content">
      </div>
      <div class="property-group">
        <label class="property-label">Size</label>
        <div class="range-wrapper">
          <input type="range" class="range-input" id="prop-fontSize" min="12" max="120" value="${el.style.fontSize}" data-field="style.fontSize">
          <span class="range-value">${el.style.fontSize}</span>
        </div>
      </div>
      <div class="property-group">
        <label class="property-label">Color</label>
        <div class="color-wrapper">
          <input type="color" class="color-input" id="prop-color" value="${el.style.color}" data-field="style.color">
          <span>${el.style.color}</span>
        </div>
      </div>
      <div class="property-group">
        <label class="property-label">Opacity</label>
        <div class="range-wrapper">
          <input type="range" class="range-input" id="prop-opacity" min="0" max="1" step="0.05" value="${el.style.opacity}" data-field="style.opacity">
          <span class="range-value">${Math.round(el.style.opacity * 100)}%</span>
        </div>
      </div>
    `;
  } else if (el.type === "divider") {
    html += `
      <div class="property-group">
        <label class="property-label">Color</label>
        <div class="color-wrapper">
          <input type="color" class="color-input" id="prop-color" value="${el.style.color}" data-field="style.color">
          <span>${el.style.color}</span>
        </div>
      </div>
      <div class="property-group">
        <label class="property-label">Line Width</label>
        <div class="range-wrapper">
          <input type="range" class="range-input" id="prop-lineWidth" min="1" max="20" value="${el.style.lineWidth}" data-field="style.lineWidth">
          <span class="range-value">${el.style.lineWidth}</span>
        </div>
      </div>
      <div class="property-group">
        <label class="property-label">Opacity</label>
        <div class="range-wrapper">
          <input type="range" class="range-input" id="prop-opacity" min="0" max="1" step="0.05" value="${el.style.opacity}" data-field="style.opacity">
          <span class="range-value">${Math.round(el.style.opacity * 100)}%</span>
        </div>
      </div>
    `;
  } else if (el.type === "textbox") {
    const boxStyles = ["default", "dashed"];
    const padding = readPadding(el.style, 12);
    const meta = readBoxLayout(el.style);
    const columns = getBoxColumns(el);
    const layoutOptions = [
      { id: "single", label: "单栏", title: "一栏：标题 + 正文" },
      { id: "columns", label: "左右分栏", title: "左右两栏，分隔线可以拖" },
      { id: "rows", label: "上下分栏", title: "上下两栏，分隔线可以拖" }
    ];
    const colLabels = meta.layout === "rows" ? ["上栏", "下栏"] : ["左栏", "右栏"];

    html += `
      <div class="property-group">
        <label class="property-label">Layout</label>
        <div class="segmented">
          ${layoutOptions.map(o => `<button class="segmented-btn ${meta.layout === o.id ? "active" : ""}" data-layout="${o.id}" title="${o.title}">${o.label}</button>`).join("")}
        </div>
      </div>
    `;

    if (meta.isSplit) {
      html += `
        <div class="property-group">
          <label class="property-label">Split</label>

          ${slimRange("G", meta.gap, "style.gap", 0, 40, "两栏之间的距离")}

    // Both columns are always offered, so switching layout never hides text the
    // user has already written — the second one is simply not drawn on canvas

    html += columnFields(0, meta.isSplit ? colLabels[0] : "Content", columns[0],
      readColumnAlign(columns[0], el.style));
    if (meta.isSplit) html += columnFields(1, colLabels[1], columns[1],
      readColumnAlign(columns[1], el.style));

    html += `
      <div class="property-group">

      <div class="property-group">
        <label class="property-label">Title</label>

        <div class="color-wrapper" style="margin-top:6px;">
