<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 14px;
  color: #333;
  background: #f5f5f7;
  overflow: hidden;
  height: 100vh;
  /* `svh` is the viewport with the mobile URL bar showing, so the layout does
     not jump when that bar slides away. Identical to 100vh on desktop. */
  height: 100svh;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

input, textarea {
  font-family: inherit;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100svh;
}

<style>
/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  height: 52px;
  background: #fff;
  border-bottom: 1px solid #e5e5e5;
  flex-shrink: 0;
}

.logo {
  font-size: 16px;
  font-weight: 700;
  color: #6b5ce7;
  letter-spacing: -0.3px;
}

.header-actions {
  display: flex;
  gap: 8px;
}

/* Main Layout */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 220px;
  background: #fff;
  border-right: 1px solid #e5e5e5;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  flex-shrink: 0;
}

.sidebar-right {
  border-right: none;
  border-left: 1px solid #e5e5e5;
}

.panel {
  padding: 16px;
  border-bottom: 1px solid #f0f0f0;
}

.panel-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: #888;
  margin-bottom: 12px;
}

/* Canvas Area */
.canvas-area {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  overflow: auto;
  padding: 40px;
  background: #f5f5f7;
}

.canvas-wrapper {
  position: relative;
}

.canvas {
  position: relative;
  width: 600px;
  height: 900px;
  background-color: #ffffff;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  border-radius: 8px;
  overflow: hidden;
  user-select: none;
  /* Empty canvas keeps vertical scrolling (a long page has to stay reachable);
     elements and handles opt out individually — see components.css. */
  touch-action: pan-y;
  -webkit-touch-callout: none;
}

.canvas.grid-enabled {
  background-image:
    linear-gradient(to right, rgba(0,0,0,0.08) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px);
  background-size: 8px 8px;
}

/* Empty state */
.empty-state {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  padding: 20px 0;
}

/* Property fields */
.property-group {
  margin-bottom: 16px;
}

.property-label {
  display: block;
  font-size: 12px;
  color: #666;
  margin-bottom: 6px;
}

.property-input {
  width: 100%;
  padding: 6px 10px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}

.property-input:focus {
  border-color: #6b5ce7;
}

.property-row {
  display: flex;
  gap: 8px;
}

.property-row .property-group {
  flex: 1;
}

/* Segmented control */
.segmented {
  display: flex;
  border: 1px solid #ddd;
  border-radius: 6px;
  overflow: hidden;
}

.segmented-btn {
  flex: 1;
  padding: 6px 0;
  font-size: 12px;
  background: #fff;
  color: #666;
  border: none;
  transition: all 0.15s;
}

.segmented-btn + .segmented-btn {
  border-left: 1px solid #ddd;
}

.segmented-btn.active {
  background: #6b5ce7;
  color: #fff;
}

/* Color picker wrapper */
.color-wrapper {
  display: flex;
  align-items: center;
  gap: 8px;
}

.color-input {
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid #ddd;
  border-radius: 6px;
  cursor: pointer;
}

/* Range input */
.range-wrapper {
  display: flex;
  align-items: center;
  gap: 8px;
}

.range-input {
  flex: 1;
}

.range-value {
  width: 36px;
  text-align: right;
  font-size: 12px;
  color: #666;
}

/* Colour + transparency on one line: swatch, alpha slider, percentage.
   Keeps a colour and its alpha visually paired instead of being two rows. */
.color-alpha {
  display: flex;
  align-items: center;
  gap: 8px;
}

.color-alpha .color-input {
  flex: 0 0 26px;
  width: 26px;
  height: 26px;
  border-radius: 5px;
}

.alpha-range {
  flex: 1;
  min-width: 0;
}

.alpha-value {
  width: 36px;
  text-align: right;
  font-size: 12px;
  color: #666;
}

/* Slider with a one-letter prefix, sits under a colour row */
.range-wrapper.slim {
  margin-top: 6px;
}

.range-prefix {
  flex: 0 0 14px;
  font-size: 11px;
  color: #999;
}

/* One-line explanation under a segmented control */
.property-hint {
  margin-top: 6px;
  font-size: 11px;
  line-height: 1.4;
  color: #aaa;
}

/* Height is derived in long-page mode, so the field reads as a value, not an input */
.property-input[readonly] {
  background: #f5f5f7;
  color: #888;
  cursor: default;
}

/* ==========================================================================
   Narrow screens

   Above the breakpoint the two sidebars are always-on columns. Below it they
   would leave nothing for the canvas (220 + 220 on a 390px screen is already
   negative), so each becomes a drawer over a full-width canvas: components
   slide in from the left, properties slide up from the bottom. The buttons
   that open them only exist here; the desktop chrome is untouched.
   ========================================================================== */

.drawer-scrim {
  position: fixed;
  inset: 0;
  background: rgba(24, 24, 28, 0.38);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.22s ease;
  z-index: 60;
}

body.drawer-left .drawer-scrim,
body.drawer-right .drawer-scrim {
  opacity: 1;
  pointer-events: auto;
}

.mobile-fabs {
  display: none;
  position: fixed;
  right: 14px;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  flex-direction: column;
  gap: 10px;
  z-index: 55;
}

.mobile-fab {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #6b5ce7;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(107, 92, 231, 0.35);
  transition: transform 0.15s ease;
}

.mobile-fab:active {
  transform: scale(0.94);
}

.mobile-fab + .mobile-fab {
  background: #ffffff;
  color: #555;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
}

/* Injected by app.js into each sidebar; the scrim is the other way out. */
.drawer-close {
  display: none;
  position: absolute;
  top: 10px;
  right: 10px;
  width: 30px;
  height: 30px;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  background: #f2f2f6;
  color: #888;
  font-size: 17px;
  line-height: 1;
}

@media (max-width: 820px) {
  .header {
    height: 48px;
    padding: 0 10px;
  }

  .logo {
    font-size: 13px;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .header-actions {
    gap: 5px;
    flex-shrink: 0;
  }

  .header-actions .btn {
    padding: 6px 8px;
    border-radius: 5px;
    font-size: 11px;
  }

  .sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    z-index: 70;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
    transition: transform 0.24s ease;
    overscroll-behavior: contain;
  }

  .sidebar-left {
    left: 0;
    width: min(300px, 84vw);
    transform: translateX(-101%);
  }

  .sidebar-right {
    top: auto;
    left: 0;
    right: 0;
    width: auto;
    height: min(58vh, 520px);
    border-left: none;
    border-top: 1px solid #e5e5e5;
    border-radius: 16px 16px 0 0;
    transform: translateY(101%);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  body.drawer-left .sidebar-left,
  body.drawer-right .sidebar-right {
    transform: translate(0, 0);
  }

  .drawer-close {
    display: flex;
  }

  .mobile-fabs {
    display: flex;
  }

  .panel {
    padding: 14px;
  }

  /* Keep the title clear of the injected close button. */
  .sidebar .panel-title {
    padding-right: 34px;
  }

  /* Two columns of components leave room for the canvas behind the drawer.
     The extra .sidebar is load-bearing: components.css is linked *after* this
     file, so a bare .component-list here would lose to its flex-direction. */
  .sidebar .component-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .canvas-area {
    padding: 14px;
  }

  .property-row {
    gap: 6px;
  }
}

/* Non-blocking export notice (e.g. a long page scaled down to fit the bitmap limit) */
.export-notice {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);
  max-width: 80vw;
  padding: 10px 16px;
  border-radius: 8px;
  background: rgba(32, 32, 36, 0.92);
  color: #fff;
  font-size: 13px;
  line-height: 1.5;
  z-index: 9999;
  pointer-events: none;
}

<style>
/* Buttons */
.btn {
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.15s;
}

.btn-primary {
  background: #6b5ce7;
  color: #fff;
}

.btn-primary:hover {
  background: #5a4dd0;
}

.btn-secondary {
  background: #f0f0f5;
  color: #555;
}

.btn-secondary:hover {
  background: #e4e4ea;
}

.btn-upload {
  width: 100%;
  margin-top: 8px;
}

/* Component List */
.component-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.component-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  background: #f8f8fb;
  color: #444;
  font-size: 13px;
  transition: all 0.15s;
  text-align: left;
}

.component-btn:hover {
  background: #f0f0f5;
}

.component-icon {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  color: #6b5ce7;
  border: 1px solid #eee;
}

/* Assets Grid */
.assets-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.assets-empty {
  grid-column: 1 / -1;
  text-align: center;
  color: #aaa;
  font-size: 12px;
  padding: 12px 0;
}

.asset-item {
  position: relative;
  aspect-ratio: 1;
  border-radius: 6px;
  background: #f8f8fb;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid #eee;
  transition: border-color 0.15s;
}

.asset-item:hover {
  border-color: #6b5ce7;
}

.asset-item img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.asset-delete {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: rgba(0,0,0,0.5);
  color: #fff;
  font-size: 14px;
  line-height: 1;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.asset-item:hover .asset-delete {
  display: flex;
}

.asset-delete:hover {
  background: #d44;
}

/* Canvas Elements */
.canvas-element {
  position: absolute;
  cursor: move;
  user-select: none;
}

.canvas-element.selected {
  outline: 2px solid #6b5ce7;
  outline-offset: 2px;
}

.canvas-element .element-content {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* Text Element */
.element-text .element-content {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  min-height: 20px;
}

.element-text .text-inner {
  width: 100%;
  outline: none;
  cursor: text;
  word-break: break-word;
}

.element-text.selected .text-inner {
  cursor: move;
}

.element-text.editing .text-inner {
  cursor: text;
}

/* Image Element */
.element-image .element-content img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  pointer-events: none;
}

/* Sticker Element */
.element-sticker .element-content {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  user-select: none;
}

/* Divider Element */
.element-divider .element-content {
  display: flex;
  align-items: center;
  justify-content: center;
}

.element-divider .divider-line {
  width: 100%;
  height: 2px;
  background: #333;
  border-radius: 1px;
}

/* Text Box Element — one or two columns, each an optional title above a body.
   The layout class picks the direction, `--split` drives both the first
   column's size and the divider position, and both are written inline by
   applyBoxBody(). */
.element-textbox .element-content {
  width: 100%;
  height: 100%;
  border: 2px solid #333;
  border-radius: 4px;
  box-sizing: border-box;
  display: flex;
  align-items: stretch;
}

.box-body {
  display: flex;
  width: 100%;
  height: 100%;
  gap: var(--box-gap, 12px);
  /* The divider is positioned against this box, not against .element-content:
     percentages there would resolve against the padding box and slide by the
     box's own padding. */
  position: relative;
}

.box-body.layout-columns { flex-direction: row; }
.box-body.layout-rows { flex-direction: column; }

.box-column {
  display: flex;
  flex-direction: column;
  /* A flex item will not shrink below its content without these, so a column
     would push its neighbour off the edge instead of clipping. */
  min-width: 0;
  min-height: 0;
  /* A text block taller than its column is cut at the column's edges rather
     than spilling over the neighbour. The exporter clips to the same rect. */
  overflow: hidden;
}

/* Where a column's text block sits vertically. The class is always written by
   applyBoxBody(), and the default value comes from readBoxLayout() — a
   single-column box centres, a split box starts at the top. So leaving the
   setting alone reproduces the original look exactly. */
.box-body.valign-top > .box-column { justify-content: flex-start; }
.box-body.valign-middle > .box-column { justify-content: center; }
.box-body.valign-bottom > .box-column { justify-content: flex-end; }

/* Only a split box divides the content area: --split sizes the first column and
   the second takes what is left. A single-column box hands its one column the
   whole area — which is what boxColumnRects() has always assumed when exporting.
   Without this the preview drew the text into the left half while the PNG
   centred it on the full frame. */
.box-body.layout-single > .box-column[data-col="0"] { flex: 1 1 0; }
.box-body.layout-columns > .box-column[data-col="0"],
.box-body.layout-rows > .box-column[data-col="0"] { flex: 0 0 var(--split, 50%); }
.box-body.layout-columns > .box-column[data-col="1"],
.box-body.layout-rows > .box-column[data-col="1"] { flex: 1 1 0; }

.box-title,
.box-text {
  outline: none;
  cursor: move;
  word-break: break-word;
  /* Keeps a typed \n a real line break, the way wrapText() does on export. */
  white-space: pre-wrap;
}

.box-title { margin-bottom: var(--title-gap, 6px); }

.element-textbox.editing .box-title,
.element-textbox.editing .box-text { cursor: text; }

/* The divider only exists on a split Box, and only shows while that Box is
   selected — otherwise it would sit on top of the text. */
.column-splitter {
  position: absolute;
  display: none;
  z-index: 12;
}

.box-body.layout-columns > .column-splitter {
  width: 11px;
  top: 0;
  bottom: 0;
  left: calc(var(--split, 50%) + var(--box-gap, 12px) / 2 - 5.5px);
  cursor: col-resize;
}

.box-body.layout-rows > .column-splitter {
  height: 11px;
  left: 0;
  right: 0;
  top: calc(var(--split, 50%) + var(--box-gap, 12px) / 2 - 5.5px);
  cursor: row-resize;
}

.canvas-element.selected .column-splitter { display: block; }

/* Centred with a transform rather than hand-tuned offsets, so the line lands
   exactly halfway between the two columns whatever the gap is. */
.column-splitter::after {
  content: "";
  position: absolute;
  background: #6b5ce7;
  opacity: 0.6;
  border-radius: 2px;
}

.box-body.layout-columns > .column-splitter::after {
  left: 50%;
  transform: translateX(-50%);
  top: 0;
  bottom: 0;
  width: 1.5px;
}

.box-body.layout-rows > .column-splitter::after {
  top: 50%;
  transform: translateY(-50%);
  left: 0;
  right: 0;
  height: 1.5px;
}

/* Image element: the frame is inline-styled (background / borders / padding /
   radius / shape clip), so there is nothing to declare here beyond the default
   size the photo fills when no crop geometry is set. */

/* Box style variants */
/* The shadow presets live entirely in the inline box-shadow written by
   applySurface(). Keeping a CSS box-shadow here as well would stack a second
   shadow on top of the one the sliders describe. */
.box-style-dashed {
  border-style: dashed !important;
}

/* Label Element */
.element-label .element-content {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4px 12px;
  border: 2px solid #333;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Resize Handles */
.resize-handle {
  position: absolute;
  /* Page units divided by the viewport scale, so the handle keeps the same
     on-screen size on a phone where the whole canvas is scaled down. The scale
     is 1 on desktop, which makes every calc() below the plain value. */
  width: calc(10px / var(--canvas-scale, 1));
  height: calc(10px / var(--canvas-scale, 1));
  background: #fff;
  border: calc(2px / var(--canvas-scale, 1)) solid #6b5ce7;
  border-radius: 50%;
  display: none;
  z-index: 10;
}

/* Fingers are a lot wider than a 10px dot. The pseudo-element widens the hit
   area without changing what the handle looks like — mouse-sized by default,
   finger-sized on a narrow screen (see the media query below). */
.resize-handle::after,
.crop-handle::after {
  content: "";
  position: absolute;
  inset: calc(-6px / var(--canvas-scale, 1));
}

.canvas-element.selected .resize-handle {
  display: block;
}

/* Touch gestures: an unselected element lets the canvas scroll under the
   finger, a selected one swallows the gesture so it can be dragged. Tapping
   selects, the next press moves — the same bargain every mobile editor makes,
   and the only way both "scroll a long page" and "drag a block" can coexist. */
.canvas-element.selected,
.resize-handle,
.crop-window-hit,
.crop-window,
.crop-handle {
  touch-action: none;
}

.resize-handle.nw { top: calc(-6px / var(--canvas-scale, 1)); left: calc(-6px / var(--canvas-scale, 1)); cursor: nw-resize; }
.resize-handle.ne { top: calc(-6px / var(--canvas-scale, 1)); right: calc(-6px / var(--canvas-scale, 1)); cursor: ne-resize; }
.resize-handle.sw { bottom: calc(-6px / var(--canvas-scale, 1)); left: calc(-6px / var(--canvas-scale, 1)); cursor: sw-resize; }
.resize-handle.se { bottom: calc(-6px / var(--canvas-scale, 1)); right: calc(-6px / var(--canvas-scale, 1)); cursor: se-resize; }

/* Content End Marker — long pages only. Sits under the crop overlay (9000) and
   above every element, and never takes pointer events so dragging is unaffected. */
.content-end-marker {
  position: absolute;
  left: 0;
  width: 100%;
  border-top: 1px dashed rgba(0, 0, 0, 0.25);
  pointer-events: none;
  z-index: 8000;
}

.content-end-label {
  position: absolute;
  right: 8px;
  top: -17px;
  font-size: 11px;
  line-height: 15px;
  padding: 0 5px;
  border-radius: 3px;
  color: #8a8a8a;
  background: rgba(255, 255, 255, 0.85);
}

/* Alignment Guides */
.alignment-guides {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9999;
}

.guide {
  position: absolute;
  background: #6b5ce7;
}

.guide-vertical {
  top: 0;
  bottom: 0;
  width: 1px;
  border-left: 1px dashed #6b5ce7;
  background: none;
}

.guide-horizontal {
  left: 0;
  right: 0;
  height: 1px;
  border-top: 1px dashed #6b5ce7;
  background: none;
}

/* Property grids for shapes and styles */
.shape-grid,
.style-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}

.shape-btn,
.style-btn {
  aspect-ratio: 1;
  border-radius: 6px;
  background: #f8f8fb;
  border: 1px solid #e0e0e6;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  transition: all 0.15s;
}

.shape-btn:hover,
.style-btn:hover {
  background: #f0f0f5;
}

.shape-btn.active,
.style-btn.active {
  border-color: #6b5ce7;
  background: #edeafd;
}

const state = {
  // `canvas` is the Page. Two modes share it:
  //   mode "fixed" → the user owns `height` (ratio preset or the Height field)
  //   mode "long"  → `syncPageHeight()` derives `height` from the content
  // Whatever writes it, `state.canvas.height` always equals "the current page
  // height", which is what drag / resize / crop / export keep reading.
  canvas: {
    mode: "fixed",
    ratio: "custom",
    width: 600,
    height: 900,
    background: "#ffffff",
    backgroundImage: null,
    minHeight: 900,
    bottomGap: 80,
    maxHeight: 20000
  },
  elements: [],
  selectedElementId: null,
  grid: {
    enabled: false,
    snap: false,
    size: 8
  },
  assets: [],
  history: {
    stack: [],
    index: -1,
    max: 50
  },
  drag: {
    active: false,
    elementId: null,
    startX: 0,
    startY: 0,
    elStartX: 0,
    elStartY: 0,
    // Whether the element was already selected when this drag began. A gesture
    // that the browser cancels (it took over as a scroll) must put the selection
    // back too, or the next swipe over the same block becomes a drag.
    wasSelected: false,
    // Last pointer position. Auto-scroll replays the drag from here while the
    // pointer rests at the edge of the viewport.
    pointerX: 0,
    pointerY: 0
  },
  crop: {
    active: false,
    elementId: null,
    shape: "none",
    draft: null
  },
  resize: {
    active: false,
    elementId: null,
    handle: null,
    startX: 0,
    startY: 0,
    startWidth: 0,
    startHeight: 0,
    startLeft: 0,
    startTop: 0,
    // Last pointer position. Auto-scroll replays the resize from here while the
    // pointer rests at the edge of the viewport (same contract as state.drag).
    pointerX: 0,
    pointerY: 0,
    aspectRatio: 1
  },
  // Dragging the divider between the two halves of a split Box.
  split: {
    active: false,
    elementId: null,
    axis: "x",
    startClient: 0,
    startSplit: 0.5,
    extent: 1
  }
};

function setCanvasBackground(color) {
  state.canvas.background = color;
  const canvas = document.getElementById("canvas");
  if (canvas) canvas.style.backgroundColor = color;
}

function setCanvasBackgroundImage(src) {
  state.canvas.backgroundImage = src;
  const canvas = document.getElementById("canvas");
  if (canvas) {
    if (src) {
      canvas.style.backgroundImage = `url("${src}")`;
      canvas.style.backgroundSize = "cover";
      canvas.style.backgroundPosition = "center";
    } else {
      canvas.style.backgroundImage = "none";
    }
  }
}

function setGridEnabled(enabled) {
  state.grid.enabled = enabled;
  const canvas = document.getElementById("canvas");
  if (canvas) {
    canvas.classList.toggle("grid-enabled", enabled);
  }
}

function setGridSnap(snap) {
  state.grid.snap = snap;
}

function setSelectedElementId(id) {
  const prevId = state.selectedElementId;
  state.selectedElementId = id;

  // Update DOM selection states
  document.querySelectorAll(".canvas-element.selected").forEach(el => {
    el.classList.remove("selected");
  });

  if (id) {
    const domEl = document.querySelector(`[data-element-id="${id}"]`);
    if (domEl) domEl.classList.add("selected");
  }

  // Notify properties panel
  if (typeof renderPropertiesPanel === "function") {
    renderPropertiesPanel();
  }
}

function snapToGrid(value) {
  if (!state.grid.snap) return value;
  const size = state.grid.size;
  return Math.round(value / size) * size;
}

function generateId() {
  return "el_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
}

<script>
// Page geometry — the only place that knows how tall the page should be.
//
// One canvas element backs both page modes:
//   fixed → the user owns `state.canvas.height` (ratio preset or Height field)
//   long  → the height is derived from the content: max(element bottom) + bottomGap
//
// The invariant both modes keep is that `state.canvas.height` always equals the
// current page height. drag / resize / crop / export all read that value, so
// nothing else has to know which mode is active.

const PAGE_RATIOS = {
  "1:1": 1,
  "3:4": 3 / 4,
  "4:3": 4 / 3,
  "9:16": 9 / 16
};

// Safety ceiling. Nothing stops the user from dragging an element down forever,
// but the page will not follow past this point.
const DEFAULT_MAX_PAGE_HEIGHT = 20000;
const DEFAULT_MIN_PAGE_HEIGHT = 900;
const DEFAULT_BOTTOM_GAP = 80;

function isLongPage() {
  return state.canvas.mode === "long";
}

function getPageMaxHeight() {
  const max = Number(state.canvas.maxHeight);
  return max > 0 ? max : DEFAULT_MAX_PAGE_HEIGHT;
}

function getPageBottomGap() {
  const gap = Number(state.canvas.bottomGap);
  return Number.isFinite(gap) ? gap : DEFAULT_BOTTOM_GAP;
}

function getPageMinHeight() {
  const min = Number(state.canvas.minHeight);
  return min > 0 ? min : DEFAULT_MIN_PAGE_HEIGHT;
}

// Lowest edge of any element. Zero on an empty page.
function computeContentBottom() {
  let bottom = 0;
  for (const el of state.elements) {
    bottom = Math.max(bottom, (Number(el.y) || 0) + (Number(el.height) || 0));
  }
  return bottom;
}

// Writes the page size to the DOM. Cheap enough to call on every pointermove.
function applyCanvasSize() {
  const canvas = document.getElementById("canvas");
  if (!canvas) return;
  canvas.style.width = state.canvas.width + "px";
  canvas.style.height = state.canvas.height + "px";
  applyCanvasScale();
  syncContentEndMarker();
}

// --- Canvas viewport scale --------------------------------------------------
//
// The page is authored at a fixed width and every element coordinate lives in
// that space — export, saved state and history all depend on it staying put. On
// a narrow screen that width does not fit, so the canvas is scaled down for
// *display only*: the DOM gets a CSS transform, and every pointer delta is
// divided by the same factor before it reaches a coordinate (drag / resize /
// crop all come through `toCanvasDelta`). Nothing else has to know.
//
// The scale only ever shrinks: on a wide screen it is exactly 1 and the canvas
// is laid out as before.

let canvasScale = 1;
// Width the current scale was derived from, so the layout read below can be
// skipped on the pointermove path (applyCanvasSize runs there).
let scaleMeasuredWidth = 0;

// Screen pixels -> page units. Any pointer delta that ends up as an element
// coordinate has to come through here, or a scaled canvas moves at the wrong
// speed under the finger.
function toCanvasDelta(value) {
  return canvasScale > 0 ? value / canvasScale : value;
}

// Measured once. 0 with overlay scrollbars (every phone), 15-17px on a desktop
// using classic ones.
let scrollbarWidth = null;

function getScrollbarWidth() {
  if (scrollbarWidth !== null) return scrollbarWidth;
  const probe = document.createElement("div");
  probe.style.cssText = "position:absolute;top:-9999px;left:0;width:100px;height:100px;overflow:scroll;";
  document.body.appendChild(probe);
  scrollbarWidth = probe.offsetWidth - probe.clientWidth;
  probe.remove();
  return scrollbarWidth;
}

function computeCanvasScale() {
  const area = document.querySelector(".canvas-area");
  const width = Number(state.canvas.width) || 600;
  if (!area) return 1;

  const cs = getComputedStyle(area);
  const padding = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
  // Room for a scrollbar is reserved whether or not one is showing right now.
  // Without that, the width this is computed from depends on the scale itself:
  // shrink enough to lose the scrollbar, the area gets wider, the scale grows,
  // the scrollbar comes back — and the two keep chasing each other. Overlay
  // scrollbars (phones) measure 0, so nothing is reserved there.
  const gutter = area.offsetWidth > area.clientWidth ? 0 : getScrollbarWidth();
  const available = area.clientWidth - padding - gutter;
  // Before first layout the area has no width yet; 1 is the safe answer.
  if (!(available > 0)) return 1;

  return Math.min(1, available / width);
}

function applyCanvasScale(force) {
  const canvas = document.getElementById("canvas");
  if (!canvas) return;

  const width = Number(state.canvas.width) || 600;
  if (force || width !== scaleMeasuredWidth) {
    canvasScale = computeCanvasScale();
    scaleMeasuredWidth = width;
  }

  const wrapper = canvas.parentElement;
  if (canvasScale === 1) {
    canvas.style.transform = "";
    canvas.style.transformOrigin = "";
  } else {
    canvas.style.transform = `scale(${canvasScale})`;
    canvas.style.transformOrigin = "0 0";
  }

  // Resize handles are sized in CSS with calc(... / var(--canvas-scale)) so they
  // keep a constant on-screen size however far the canvas is scaled down.
  canvas.style.setProperty("--canvas-scale", String(canvasScale));

  // A transform does not change the layout box, so the scroll area the wrapper
  // provides has to be set by hand — otherwise the page would still scroll as
  // if the canvas were full size.
  if (wrapper) {
    wrapper.style.width = width * canvasScale + "px";
    wrapper.style.height = state.canvas.height * canvasScale + "px";
  }
}

// A drawer opening, a phone rotating or a URL bar sliding away all change the
// available width without a window `resize`, so the observer is the reliable
// trigger. `force` because the canvas width itself did not change.
function initCanvasScaleObserver() {
  applyCanvasScale(true);
  const area = document.querySelector(".canvas-area");
  if (!area || typeof ResizeObserver === "undefined") {
    window.addEventListener("resize", () => applyCanvasScale(true));
    return;
  }
  const observer = new ResizeObserver(() => applyCanvasScale(true));
  observer.observe(area);
}

// --- Content end marker -----------------------------------------------------

// In long mode the page keeps going past the last block into the bottom gap, so
// nothing on screen says where the artwork actually stops. This draws that line.
// It is a DOM decoration only — the exporter renders from `state`, so the line
// never ends up in the PNG.
const CONTENT_END_MARKER_ID = "content-end-marker";

function syncContentEndMarker() {
  const canvas = document.getElementById("canvas");
  if (!canvas) return;

  const marker = document.getElementById(CONTENT_END_MARKER_ID);
  const bottom = Math.round(computeContentBottom());

  // Fixed mode has a page edge the user set themselves; an empty page has no
  // content to end. Both cases mean no line.
  if (!isLongPage() || bottom <= 0) {
    if (marker) marker.remove();
    return;
  }

  if (!marker) {
    const node = document.createElement("div");
    node.className = "content-end-marker";
    node.id = CONTENT_END_MARKER_ID;
    node.innerHTML = '<span class="content-end-label">内容结束</span>';
    canvas.appendChild(node);
    node.style.top = bottom + "px";
    return;
  }

  // Re-created after every `renderAllElements` (which clears the canvas), so
  // the cache is just a cheap guard against pointless style writes.
  if (marker.style.top !== bottom + "px") marker.style.top = bottom + "px";
}

// Keeps the Height field honest while the page grows on its own.
function refreshPageHeightField() {
  const input = document.getElementById("canvas-height");
  if (input && input.value !== String(Math.round(state.canvas.height))) {
    input.value = Math.round(state.canvas.height);
  }
}

// Recompute the page height from the content. Long mode only — in fixed mode the
// height belongs to the user and this is a no-op.
function syncPageHeight() {
  if (!isLongPage()) return;
  // The content bottom can move while the page height stays put (a shorter
  // block, a deleted one, the minimum height doing its job). The end line still
  // has to follow, so it is refreshed before the early return below.
  syncContentEndMarker();
  const target = Math.min(
    getPageMaxHeight(),
    Math.max(getPageMinHeight(), Math.round(computeContentBottom() + getPageBottomGap()))
  );
  if (target === state.canvas.height) return;
  state.canvas.height = target;
  applyCanvasSize();
  refreshPageHeightField();
}

// Called during a drag / resize: grow if the element hangs past the bottom, but
// never shrink. Shrinking under the pointer makes the page jitter, so the
// reclaim happens once, on pointerup, via syncPageHeight().
function growCanvasIfNeeded(y, height) {
  if (!isLongPage()) return;
  const need = Math.min(
    getPageMaxHeight(),
    Math.round((Number(y) || 0) + (Number(height) || 0) + getPageBottomGap())
  );
  if (need > state.canvas.height) {
    state.canvas.height = need;
    applyCanvasSize();
    refreshPageHeightField();
  }
}

// Long mode has no hard bottom, but it stops at the ceiling so an element can
// never be dragged into a region the page refuses to grow into.
function clampPageY(y, height) {
  if (!isLongPage()) {
    return Math.max(0, Math.min(y, state.canvas.height - (Number(height) || 0)));
  }
  return Math.max(0, Math.min(y, getPageMaxHeight() - (Number(height) || 0)));
}

// Fixed mode: apply a ratio preset. Width stays, height follows.
function applyPageRatio(ratio) {
  state.canvas.ratio = ratio;
  const r = PAGE_RATIOS[ratio];
  if (r) {
    state.canvas.height = Math.round(state.canvas.width / r);
    applyCanvasSize();
    refreshPageHeightField();
  }
}

// Any manual size change drops the ratio back to "custom" — otherwise the panel
// would claim 3:4 while showing a box that is not.
function markRatioCustom() {
  state.canvas.ratio = "custom";
}

// Where a brand-new element lands when the caller gave no position. In long mode
// that is just below the existing content, so "add a block" keeps stacking
// downwards. The element stays absolutely positioned and fully draggable.
function getNewElementY() {
  if (!isLongPage()) return 50;
  const bottom = computeContentBottom();
  if (bottom <= 0) return 50;
  return Math.round(Math.min(bottom + 20, Math.max(0, getPageMaxHeight() - 100)));
}

// --- Tidy into a list -------------------------------------------------------

// "Stack it neatly" is a button, not a layout engine: free placement stays the
// rule, and this just re-lays what is already there out in one pass. Long mode
// only — a fixed page has a bottom the user chose, and a stack would run past it.
const TIDY_TOP = 40;
const TIDY_LEFT = 40;
const TIDY_GAP = 24;

// Returns false when there is nothing to do, so the caller can skip the history
// entry for a click that changed nothing.
function tidyIntoList() {
  if (!isLongPage() || state.elements.length === 0) return false;

  // Reading order: top to bottom, and left to right for elements on the same line.
  const ordered = state.elements.slice().sort((a, b) => (a.y - b.y) || (a.x - b.x));
  let cursor = TIDY_TOP;

  for (const el of ordered) {
    // A very wide block would hang off a narrow page, so the shared left edge
    // gives way to keeping the element inside.
    el.x = Math.max(0, Math.min(TIDY_LEFT, state.canvas.width - el.width));
    el.y = cursor;
    cursor += el.height + TIDY_GAP;
    updateElementDOM(el);
  }

  syncPageHeight();
  return true;
}

</script>
<script>
// Surface decoration shared by anything that can carry a frame: background,
// inner border, outer border and shadow. Colours are stored as hex plus a
// separate 0..1 alpha so the colour pickers keep working and transparency is
// an explicit choice instead of a magic value.
const SURFACE_DEFAULTS = {
  backgroundColor: "transparent",
  backgroundAlpha: 1,
  borderColor: "#333333",
  borderWidth: 0,
  borderAlpha: 1,
  borderOuterWidth: 0,
  borderOuterColor: "#333333",
  borderOuterAlpha: 1,
  // Shadow is fully parameterised: X/Y push it around, B blurs its edge, S
  // spreads it (positive fattens the shadow, negative shrinks it). No presets —
  // every slider means exactly one thing.
  shadowX: 0,
  shadowY: 0,
  shadowBlur: 0,
  shadowSpread: 0,
  shadowColor: "#000000",
  shadowAlpha: 0.2
};

const DEFAULT_DIMENSIONS = {
  text: { width: 200, height: 40 },
  image: { width: 150, height: 150 },
  sticker: { width: 50, height: 50 },
  divider: { width: 200, height: 10 },
  textbox: { width: 150, height: 100 },
  label: { width: 80, height: 30 }
