<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moe Bio Editor</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute;width:0;height:0;">
    <defs>
      <!-- Normalised to the full 0..1 box: the tip sits on the bottom edge so a
           heart frame has no dead strip underneath it. -->
      <clipPath id="clip-heart" clipPathUnits="objectBoundingBox">
        <path d="M0.5 1 C0.1 0.682 0 0.455 0 0.284 C0 0.114 0.15 0 0.3 0 C0.4 0 0.47 0.08 0.5 0.17 C0.53 0.08 0.6 0 0.7 0 C0.85 0 1 0.114 1 0.284 C1 0.455 0.9 0.682 0.5 1 Z"/>
      </clipPath>
      <clipPath id="clip-arch" clipPathUnits="objectBoundingBox">
        <path d="M0 1 L0 0.3 Q0.5 0 1 0.3 L1 1 Z"/>
      </clipPath>
    </defs>
  </svg>

  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">Moe Bio Editor</div>
      <div class="header-actions">
        <button class="btn btn-secondary" id="btn-grid">Grid: OFF</button>
        <button class="btn btn-secondary" id="btn-snap">Snap: OFF</button>
        <button class="btn btn-secondary" id="btn-new">New</button>
        <button class="btn btn-primary" id="btn-export">Export PNG</button>
      </div>
    </header>

    <!-- Main -->
    <div class="main">
      <!-- Left Sidebar -->
      <aside class="sidebar sidebar-left">
        <section class="panel">
          <h3 class="panel-title">Components</h3>
          <div class="component-list">
            <button class="component-btn" data-type="text">
              <span class="component-icon">T</span>
              <span>Text</span>
            </button>
            <button class="component-btn" data-type="image">
              <span class="component-icon">IMG</span>
              <span>Image</span>
            </button>
            <button class="component-btn" data-type="divider">
              <span class="component-icon">—</span>
              <span>Divider</span>
            </button>
            <button class="component-btn" data-type="textbox">
              <span class="component-icon">□</span>
              <span>Text Box</span>
            </button>
            <button class="component-btn" data-type="label">
              <span class="component-icon">L</span>
              <span>Label</span>
            </button>
            <button class="component-btn" data-type="sticker">
              <span class="component-icon">✦</span>
              <span>Sticker</span>
            </button>
          </div>
        </section>

        <section class="panel">
          <h3 class="panel-title">My Assets</h3>
          <div class="assets-grid" id="assets-grid"></div>
          <button class="btn btn-secondary btn-upload" id="btn-upload">+ Upload</button>
          <input type="file" id="file-upload" accept="image/*" multiple hidden>
        </section>
      </aside>

      <!-- Canvas Area -->
      <div class="canvas-area">
        <div class="canvas-wrapper">
          <div class="canvas" id="canvas"></div>
        </div>
      </div>

      <!-- Right Sidebar -->
      <aside class="sidebar sidebar-right">
        <section class="panel" id="properties-panel">
          <h3 class="panel-title">Properties</h3>
          <div class="empty-state">Select an element to edit</div>
        </section>
      </aside>
    </div>
  </div>

  <!-- Narrow-screen chrome: both sidebars become drawers, so the canvas gets
       the whole viewport. Hidden above the breakpoint. -->
  <div class="drawer-scrim" id="drawer-scrim"></div>
  <div class="mobile-fabs" id="mobile-fabs">
    <button class="mobile-fab" id="fab-components" aria-label="Open components">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path d="M9 3.5v11M3.5 9h11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="mobile-fab" id="fab-properties" aria-label="Open properties">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path d="M3.5 5h11M3.5 9h11M3.5 13h11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <script src="js/state.js"></script>
  <script src="js/page.js"></script>
  <script src="js/elements.js"></script>
  <script src="js/autoscroll.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/resize.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/export.js"></script>
  <script src="js/history.js"></script>
  <script src="js/alignment.js"></script>
  <script src="js/crop.js"></script>
  <script src="js/columns.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
